let previewZoomScale = 1;
let previewRotateDeg = 0;
let previewTabs = []; // [{path, title}]
let previewActivePath = '';
let previewLoadSeq = 0;
const PREVIEW_TAB_MAX = 12;
let ptabDragPath = null;
let ptabCtxPath = '';
let ptabCtxIgnoreClick = false;
/** 每个已打开文件的加载序号，用于忽略过期异步回调 */
let previewLoadIds = {};
/** 每个 pane 的缩放/旋转（切 tab 时各自保留） */
let previewPaneView = {}; // path -> {zoom, rotate}

function previewTabTitle(path) {
    const info = parsePreviewKey(path);
    const parts = String(info.path || '').replace(/\\/g, '/').split('/').filter(Boolean);
    const base = parts.length ? parts[parts.length - 1] : (info.path || '未命名');
    if (info.rev != null) return base + ' · r' + info.rev;
    return base;
}

function parsePreviewKey(key) {
    const s = String(key || '');
    const m = s.match(/^@r(\d+):(.*)$/);
    if (m) return { rev: Number(m[1]), path: m[2], key: s };
    return { rev: null, path: s, key: s };
}

function makePreviewKey(path, rev) {
    if (rev != null && rev !== '') return '@r' + rev + ':' + path;
    return path;
}

function rawFileUrl(path, rev) {
    let u = '/api/raw?file=' + encodeURIComponent(path);
    if (rev != null && rev !== '') u += '&rev=' + encodeURIComponent(rev);
    return u;
}

function previewApiPath(path, rev) {
    let u = 'preview?name=' + encodeURIComponent(path);
    if (rev != null && rev !== '') u += '&rev=' + encodeURIComponent(rev);
    return u;
}

function openPreviewAtRev(path, rev) {
    if (!path || !rev) return;
    const key = makePreviewKey(path, rev);
    let tab = previewTabs.find(function(t) { return t.path === key; });
    if (!tab) {
        if (previewTabs.length >= PREVIEW_TAB_MAX) {
            const drop = previewTabs.find(function(t) { return t.path !== previewActivePath; }) || previewTabs[0];
            previewTabs = previewTabs.filter(function(t) { return t.path !== drop.path; });
            destroyPreviewPane(drop.path);
        }
        tab = { path: key, title: previewTabTitle(key) };
        previewTabs.push(tab);
    }
    closeModal('historyModal');
    activatePreviewTab(key, { forceReload: true });
}

function invalidatePreviewLoad(path) {
    if (!path) return;
    previewLoadIds[path] = -1;
}

function getPreviewHost() {
    return document.getElementById('previewContent');
}

function findPreviewPane(path) {
    const host = getPreviewHost();
    if (!host || !path) return null;
    try {
        return host.querySelector('.preview-pane[data-path="' + CSS.escape(path) + '"]');
    } catch (err) {
        const panes = host.querySelectorAll('.preview-pane[data-path]');
        for (let i = 0; i < panes.length; i++) {
            if (panes[i].getAttribute('data-path') === path) return panes[i];
        }
        return null;
    }
}

function ensurePreviewPane(path) {
    let pane = findPreviewPane(path);
    if (pane) return pane;
    const host = getPreviewHost();
    if (!host || !path) return null;
    pane = document.createElement('div');
    pane.className = 'preview-pane';
    pane.setAttribute('data-path', path);
    host.appendChild(pane);
    return pane;
}

function destroyPreviewPane(path) {
    const pane = findPreviewPane(path);
    if (pane && pane.parentNode) pane.parentNode.removeChild(pane);
    delete previewPaneView[path];
    invalidatePreviewLoad(path);
}

function clearAllPreviewPanes() {
    const host = getPreviewHost();
    if (host) {
        host.querySelectorAll('.preview-pane[data-path]').forEach(function(p) {
            p.parentNode.removeChild(p);
        });
    }
    previewPaneView = {};
    previewLoadIds = {};
}

function getPreviewContainer(name, loadId) {
    if (!name || previewLoadIds[name] !== loadId) return null;
    return ensurePreviewPane(name);
}

function markPaneReady(container, withToolbar) {
    if (!container) return;
    container.dataset.loaded = '1';
    container.dataset.toolbar = withToolbar ? '1' : '0';
}

function applyPreviewChrome(name, loadId, opts) {
    if (!name || previewLoadIds[name] !== loadId) return;
    opts = opts || {};
    const pane = ensurePreviewPane(name);
    if (!pane) return;
    pane.classList.toggle('pdf-mode', !!opts.pdfMode);
    pane.classList.toggle('sheet-mode', !!opts.sheetMode);
    pane.dataset.toolbar = opts.toolbar ? '1' : '0';
    if (previewActivePath === name) syncViewportChrome(pane, !!opts.toolbar);
}

function syncViewportChrome(pane, toolbar) {
    const vp = document.getElementById('previewViewport');
    const host = getPreviewHost();
    const pdf = !!(pane && pane.classList.contains('pdf-mode'));
    const sheet = !!(pane && pane.classList.contains('sheet-mode'));
    if (vp) {
        vp.classList.toggle('pdf-mode', pdf);
        vp.classList.toggle('sheet-mode', sheet);
    }
    if (host) {
        host.classList.toggle('pdf-mode', pdf);
        host.classList.toggle('sheet-mode', sheet);
    }
    if (toolbar == null && pane) toolbar = pane.dataset.toolbar === '1';
    showPreviewToolbar(!!toolbar);
}

function rememberPaneView(path) {
    if (!path) return;
    previewPaneView[path] = { zoom: previewZoomScale, rotate: previewRotateDeg };
}

function restorePaneView(path) {
    const v = previewPaneView[path];
    previewZoomScale = v && v.zoom != null ? v.zoom : 1;
    previewRotateDeg = v && v.rotate != null ? v.rotate : 0;
    applyPreviewTransform();
}

function showPreviewPane(path) {
    const host = getPreviewHost();
    if (!host) return null;
    let active = null;
    host.querySelectorAll('.preview-pane').forEach(function(pane) {
        const isEmpty = pane.hasAttribute('data-preview-empty');
        const on = path ? (pane.getAttribute('data-path') === path) : isEmpty;
        pane.classList.toggle('is-active', on);
        if (on) active = pane;
    });
    if (path && !active) {
        active = ensurePreviewPane(path);
        if (active) active.classList.add('is-active');
        host.querySelectorAll('.preview-pane[data-preview-empty]').forEach(function(p) {
            p.classList.remove('is-active');
        });
    }
    if (active && path) syncViewportChrome(active);
    else {
        const vp = document.getElementById('previewViewport');
        if (vp) {
            vp.classList.remove('pdf-mode');
            vp.classList.remove('sheet-mode');
        }
        if (host) {
            host.classList.remove('pdf-mode');
            host.classList.remove('sheet-mode');
        }
        showPreviewToolbar(false);
    }
    return active;
}

function activatePreviewTab(path, opts) {
    opts = opts || {};
    if (!path) return;
    if (path === previewActivePath && !opts.forceReload) {
        if (opts.syncSelection) setSingleSelection(path, 'file');
        return;
    }
    rememberPaneView(previewActivePath);
    previewActivePath = path;
    renderPreviewTabBar();
    const pane = showPreviewPane(path);
    restorePaneView(path);
    const inFlight = !!(pane && previewLoadIds[path] > 0 && !pane.dataset.loaded);
    if (opts.forceReload || !pane || (!pane.dataset.loaded && !inFlight)) {
        previewFile(path);
    }
    if (opts.syncSelection) setSingleSelection(path, 'file');
}

function showPreviewEmptyState() {
    previewActivePath = '';
    showPreviewToolbar(false);
    resetPreviewTransform();
    const host = getPreviewHost();
    const vp = document.getElementById('previewViewport');
    if (vp) {
        vp.classList.remove('pdf-mode');
        vp.classList.remove('sheet-mode');
    }
    if (host) {
        host.classList.remove('pdf-mode');
        host.classList.remove('sheet-mode');
        let empty = host.querySelector('.preview-pane[data-preview-empty]');
        if (!empty) {
            empty = document.createElement('div');
            empty.className = 'preview-pane is-empty';
            empty.setAttribute('data-preview-empty', '1');
            empty.innerHTML = '<div class="preview-empty">' +
                '<div>在左侧选择文件预览</div>' +
                '<div class="flow">可同时打开多个文件，用上方标签切换</div></div>';
            host.appendChild(empty);
        }
        host.querySelectorAll('.preview-pane').forEach(function(p) {
            p.classList.toggle('is-active', p === empty);
        });
    }
}

function updatePreviewTabNav() {
    const wrap = document.getElementById('previewTabsWrap');
    if (!wrap || wrap.hidden) return;
    const tabs = document.getElementById('previewTabs');
    const prev = wrap.querySelector('.ptab-nav-prev');
    const next = wrap.querySelector('.ptab-nav-next');
    if (!tabs || !prev || !next) return;
    const need = tabs.scrollWidth > tabs.clientWidth + 2;
    const max = Math.max(0, tabs.scrollWidth - tabs.clientWidth - 1);
    prev.disabled = !need || tabs.scrollLeft <= 1;
    next.disabled = !need || tabs.scrollLeft >= max;
    prev.style.visibility = need ? 'visible' : 'hidden';
    next.style.visibility = need ? 'visible' : 'hidden';
}

function clearPreviewTabDragMarks() {
    const tabsEl = document.getElementById('previewTabs');
    if (!tabsEl) return;
    tabsEl.querySelectorAll('.preview-tab').forEach(function(el) {
        el.classList.remove('dragging', 'drag-over-left', 'drag-over-right');
    });
}

function movePreviewTab(fromPath, toPath, placeAfter) {
    if (!fromPath || !toPath || fromPath === toPath) return;
    const fromIdx = previewTabs.findIndex(function(t) { return t.path === fromPath; });
    const toIdx = previewTabs.findIndex(function(t) { return t.path === toPath; });
    if (fromIdx < 0 || toIdx < 0) return;
    const item = previewTabs.splice(fromIdx, 1)[0];
    let insertAt = toIdx;
    if (fromIdx < toIdx) insertAt = toIdx - 1;
    if (placeAfter) insertAt += 1;
    if (insertAt < 0) insertAt = 0;
    if (insertAt > previewTabs.length) insertAt = previewTabs.length;
    previewTabs.splice(insertAt, 0, item);
    renderPreviewTabBar();
}

function bindPreviewTabInteractions(tabsEl) {
    tabsEl.querySelectorAll('.preview-tab').forEach(function(btn) {
        btn.draggable = true;
        btn.addEventListener('click', function(e) {
            if (e.target.closest && e.target.closest('[data-close]')) return;
            const p = btn.getAttribute('data-path');
            if (p) switchPreviewTab(p);
        });
        btn.addEventListener('auxclick', function(e) {
            if (e.button === 1) {
                e.preventDefault();
                closePreviewTab(btn.getAttribute('data-path'));
            }
        });
        btn.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            showPtabCtxMenu(e.clientX, e.clientY, btn.getAttribute('data-path'));
        });
        btn.addEventListener('dragstart', function(e) {
            if (e.target.closest && e.target.closest('[data-close]')) {
                e.preventDefault();
                return;
            }
            ptabDragPath = btn.getAttribute('data-path');
            btn.classList.add('dragging');
            try {
                e.dataTransfer.setData('text/ptab-path', ptabDragPath || '');
                e.dataTransfer.setData('text/plain', ptabDragPath || '');
                e.dataTransfer.effectAllowed = 'move';
            } catch (err) {}
            hidePtabCtxMenu();
        });
        btn.addEventListener('dragend', function() {
            ptabDragPath = null;
            clearPreviewTabDragMarks();
        });
        btn.addEventListener('dragover', function(e) {
            const src = ptabDragPath || (e.dataTransfer && e.dataTransfer.getData('text/ptab-path'));
            if (!src) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const rect = btn.getBoundingClientRect();
            const after = (e.clientX - rect.left) > rect.width / 2;
            btn.classList.toggle('drag-over-left', !after);
            btn.classList.toggle('drag-over-right', after);
            tabsEl.querySelectorAll('.preview-tab').forEach(function(el) {
                if (el !== btn) el.classList.remove('drag-over-left', 'drag-over-right');
            });
        });
        btn.addEventListener('dragleave', function() {
            btn.classList.remove('drag-over-left', 'drag-over-right');
        });
        btn.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const src = ptabDragPath || (e.dataTransfer && (
                e.dataTransfer.getData('text/ptab-path') || e.dataTransfer.getData('text/plain')
            ));
            const dest = btn.getAttribute('data-path');
            const rect = btn.getBoundingClientRect();
            const after = (e.clientX - rect.left) > rect.width / 2;
            clearPreviewTabDragMarks();
            ptabDragPath = null;
            if (src && dest) movePreviewTab(src, dest, after);
        });
    });
    tabsEl.querySelectorAll('[data-close]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            closePreviewTab(btn.getAttribute('data-close'));
        });
        btn.addEventListener('mousedown', function(e) {
            // 避免拖动关闭按钮时启动标签拖拽
            e.stopPropagation();
        });
    });
}

function renderPreviewTabBar() {
    const wrap = document.getElementById('previewTabsWrap');
    const tabsEl = document.getElementById('previewTabs');
    if (!wrap || !tabsEl) return;
    if (!previewTabs.length) {
        wrap.hidden = true;
        tabsEl.innerHTML = '';
        hidePtabCtxMenu();
        return;
    }
    wrap.hidden = false;
    let html = '';
    previewTabs.forEach(function(t) {
        const active = t.path === previewActivePath;
        html += '<button type="button" class="preview-tab' + (active ? ' active' : '') +
            '" data-path="' + esc(t.path) + '" title="' + esc(t.path) + '">' +
            '<span class="ptab-name">' + esc(t.title) + '</span>' +
            '<span class="ptab-close" data-close="' + esc(t.path) + '" title="关闭">×</span>' +
            '</button>';
    });
    tabsEl.innerHTML = html;
    bindPreviewTabInteractions(tabsEl);
    const activeBtn = tabsEl.querySelector('.preview-tab.active');
    if (activeBtn) {
        try { activeBtn.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } catch (err) {}
    }
    setTimeout(updatePreviewTabNav, 30);
}

function openPreviewTab(path) {
    if (!path) return;
    let tab = previewTabs.find(function(t) { return t.path === path; });
    if (!tab) {
        if (previewTabs.length >= PREVIEW_TAB_MAX) {
            const drop = previewTabs.find(function(t) { return t.path !== previewActivePath; }) || previewTabs[0];
            previewTabs = previewTabs.filter(function(t) { return t.path !== drop.path; });
            destroyPreviewPane(drop.path);
        }
        tab = { path: path, title: previewTabTitle(path) };
        previewTabs.push(tab);
    }
    activatePreviewTab(path);
}

function switchPreviewTab(path) {
    if (!path || previewActivePath === path) return;
    if (!previewTabs.some(function(t) { return t.path === path; })) return;
    activatePreviewTab(path, { syncSelection: true });
}

function closePreviewTab(path) {
    if (!path) return;
    const idx = previewTabs.findIndex(function(t) { return t.path === path; });
    if (idx < 0) return;
    previewTabs.splice(idx, 1);
    destroyPreviewPane(path);
    if (previewActivePath === path) {
        const next = previewTabs[idx] || previewTabs[idx - 1] || null;
        previewActivePath = '';
        if (next) {
            activatePreviewTab(next.path, { syncSelection: true });
        } else {
            renderPreviewTabBar();
            showPreviewEmptyState();
        }
    } else {
        renderPreviewTabBar();
    }
}

function closeOtherPreviewTabs(path) {
    if (!path) return;
    const keep = previewTabs.find(function(t) { return t.path === path; });
    if (!keep) return;
    previewTabs.forEach(function(t) {
        if (t.path !== path) destroyPreviewPane(t.path);
    });
    previewTabs = [keep];
    // 若当前已是该 tab，activate 会早退，必须手动刷新标签栏
    if (previewActivePath === path) {
        renderPreviewTabBar();
        setSingleSelection(path, 'file');
        return;
    }
    activatePreviewTab(path, { syncSelection: true });
}

function closeAllPreviewTabs() {
    previewTabs = [];
    previewActivePath = '';
    clearAllPreviewPanes();
    renderPreviewTabBar();
    showPreviewEmptyState();
}

function showPtabCtxMenu(x, y, path) {
    hideCtxMenu();
    const menu = document.getElementById('ptabCtxMenu');
    if (!menu || !path) return;
    ptabCtxPath = path;
    const othersBtn = menu.querySelector('[data-ptab-act="close-others"]');
    if (othersBtn) othersBtn.disabled = previewTabs.length <= 1;
    menu.classList.add('show');
    const w = menu.offsetWidth || 140;
    const h = menu.offsetHeight || 100;
    menu.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
    // 右键后部分浏览器会再冒泡一次 click，忽略以免立刻清掉路径
    ptabCtxIgnoreClick = true;
    setTimeout(function() { ptabCtxIgnoreClick = false; }, 0);
}

function hidePtabCtxMenu() {
    const menu = document.getElementById('ptabCtxMenu');
    if (menu) menu.classList.remove('show');
    ptabCtxPath = '';
}

function ptabCtxAction(act, path) {
    const target = path || ptabCtxPath;
    hidePtabCtxMenu();
    if (!act || !target) return;
    if (act === 'close') closePreviewTab(target);
    else if (act === 'close-others') closeOtherPreviewTabs(target);
    else if (act === 'close-all') closeAllPreviewTabs();
}

function prunePreviewTabs(validPaths) {
    const set = {};
    (validPaths || []).forEach(function(p) { set[p] = true; });
    const before = previewTabs.length;
    const removed = [];
    previewTabs = previewTabs.filter(function(t) {
        // 历史预览标签不受工作区文件列表裁剪
        if (String(t.path).indexOf('@r') === 0) return true;
        if (set[t.path]) return true;
        removed.push(t.path);
        return false;
    });
    removed.forEach(function(p) { destroyPreviewPane(p); });
    if (!previewTabs.length) {
        if (before) {
            previewActivePath = '';
            renderPreviewTabBar();
            showPreviewEmptyState();
        }
        return;
    }
    if (!previewTabs.some(function(t) { return t.path === previewActivePath; })) {
        activatePreviewTab(previewTabs[previewTabs.length - 1].path);
    } else if (before !== previewTabs.length) {
        renderPreviewTabBar();
    }
}

(function initPreviewTabNav() {
    const wrap = document.getElementById('previewTabsWrap');
    if (!wrap) return;
    const tabs = document.getElementById('previewTabs');
    const prev = wrap.querySelector('.ptab-nav-prev');
    const next = wrap.querySelector('.ptab-nav-next');
    if (prev) prev.addEventListener('click', function() {
        if (tabs) tabs.scrollBy({ left: -140, behavior: 'smooth' });
    });
    if (next) next.addEventListener('click', function() {
        if (tabs) tabs.scrollBy({ left: 140, behavior: 'smooth' });
    });
    if (tabs) tabs.addEventListener('scroll', updatePreviewTabNav, { passive: true });
    window.addEventListener('resize', updatePreviewTabNav);
})();

function resetPreviewTransform() {
    previewZoomScale = 1;
    previewRotateDeg = 0;
    applyPreviewTransform();
}

function applyPreviewTransform() {
    const stage = document.getElementById('previewStage');
    const label = document.getElementById('previewZoomLabel');
    if (stage) {
        stage.style.transform = 'scale(' + previewZoomScale + ') rotate(' + previewRotateDeg + 'deg)';
    }
    if (label) label.textContent = Math.round(previewZoomScale * 100) + '%';
}

function previewZoom(delta) {
    previewZoomScale = Math.min(3, Math.max(0.4, Math.round((previewZoomScale + delta) * 100) / 100));
    applyPreviewTransform();
    rememberPaneView(previewActivePath);
}

function previewZoomReset() {
    previewZoomScale = 1;
    applyPreviewTransform();
    rememberPaneView(previewActivePath);
}

function previewRotate(delta) {
    previewRotateDeg = (previewRotateDeg + delta) % 360;
    applyPreviewTransform();
    rememberPaneView(previewActivePath);
}

function showPreviewToolbar(show) {
    const tb = document.getElementById('previewToolbar');
    if (!tb) return;
    tb.classList.toggle('show', !!show);
}

function downloadPreviewFile() {
    if (!previewActivePath) {
        showToast('没有可下载的文件', 'error');
        return;
    }
    const info = parsePreviewKey(previewActivePath);
    if (info.rev != null) {
        downloadRevFile(info.path, info.rev, 'at');
        return;
    }
    downloadWorkspaceFile(info.path);
}

function downloadWorkspaceFile(path) {
    const base = String(path).split('/').pop() || 'download';
    const url = '/api/download?file=' + encodeURIComponent(path);
    showLoading('正在下载…');
    fetch(url).then(function(r) {
        if (!r.ok) {
            return r.json().then(function(j) {
                throw new Error((j && j.error) || ('HTTP ' + r.status));
            }).catch(function(e) {
                if (e && e.message) throw e;
                throw new Error('HTTP ' + r.status);
            });
        }
        return r.blob();
    }).then(function(blob) {
        hideLoading();
        const a = document.createElement('a');
        const obj = URL.createObjectURL(blob);
        a.href = obj;
        a.download = base;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(obj); }, 2000);
        document.getElementById('statusBar').textContent = '已下载 ' + base;
    }).catch(function(err) {
        hideLoading();
        showToast('下载失败: ' + (err && err.message ? err.message : err), 'error');
    });
}

function previewFile(name) {
    if (!name) {
        showPreviewEmptyState();
        return;
    }
    const info = parsePreviewKey(name);
    const filePath = info.path;
    const rev = info.rev;
    previewActivePath = name || '';
    const loadId = ++previewLoadSeq;
    previewLoadIds[name] = loadId;
    const pane = ensurePreviewPane(name);
    if (!pane) return;
    delete pane.dataset.loaded;
    pane.dataset.toolbar = '0';
    pane.dataset.filePath = filePath || '';
    pane.dataset.rev = rev != null ? String(rev) : '';
    pane.classList.remove('pdf-mode');
    pane.classList.remove('sheet-mode');
    showPreviewPane(name);
    resetPreviewTransform();
    previewPaneView[name] = { zoom: 1, rotate: 0 };
    showPreviewToolbar(false);
    pane.innerHTML = '<div class="preview-loading"><div class="spinner"></div><div>正在加载预览' +
        (rev != null ? '（r' + rev + '）' : '') + '...</div></div>';
    api(previewApiPath(filePath, rev), 'GET', null, d => {
        const container = getPreviewContainer(name, loadId);
        if (!container) return;
        if (d.type === 'docx') {
            applyPreviewChrome(name, loadId, { toolbar: true });
            renderDocx(name, loadId);
        } else if (d.type === 'markdown') {
            applyPreviewChrome(name, loadId, { toolbar: true });
            renderMarkdown(name, loadId);
        } else if (d.type === 'spreadsheet') {
            applyPreviewChrome(name, loadId, { toolbar: true, sheetMode: true });
            renderSpreadsheet(name, loadId);
        } else if (d.type === 'image') {
            applyPreviewChrome(name, loadId, { toolbar: true });
            container.innerHTML = '<img class="preview-image" src="' + rawFileUrl(filePath, rev) +
                '" alt="' + esc(d.name || filePath) + '">';
            markPaneReady(container, true);
        } else if (d.type === 'pdf' && d.url) {
            applyPreviewChrome(name, loadId, { toolbar: true, pdfMode: true });
            container.innerHTML = '<iframe src="' + d.url + '" style="width:100%;height:100%;border:none;min-height:70vh"></iframe>';
            markPaneReady(container, true);
        } else if (d.type === 'unsupported') {
            applyPreviewChrome(name, loadId, { toolbar: false });
            renderUnsupported(container, d, filePath);
            markPaneReady(container, false);
        } else if (d.is_html && d.html) {
            applyPreviewChrome(name, loadId, { toolbar: true });
            container.innerHTML = d.html;
            markPaneReady(container, true);
        } else if (d.html != null) {
            applyPreviewChrome(name, loadId, { toolbar: true });
            container.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit;margin:0">' +
                String(d.html).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>';
            markPaneReady(container, true);
        } else {
            applyPreviewChrome(name, loadId, { toolbar: false });
            renderUnsupported(container, d || {}, filePath);
            markPaneReady(container, false);
        }
    }, function(err) {
        const container = getPreviewContainer(name, loadId);
        if (!container) return;
        applyPreviewChrome(name, loadId, { toolbar: false });
        container.innerHTML = '<div class="preview-empty">加载预览失败</div>';
        markPaneReady(container, false);
    });
}

function renderUnsupported(container, d, path) {
    const name = d.name || (path ? String(path).split('/').pop() : '未知文件');
    const ext = d.ext || '';
    const size = d.size || '';
    const hint = d.hint || d.error || '该类型暂不支持在线预览，可下载到本地查看。';
    const metaParts = [];
    if (ext) metaParts.push(ext.replace(/^\./, '').toUpperCase() || '未知类型');
    if (size) metaParts.push(size);
    container.innerHTML =
        '<div class="preview-unsupported">' +
            '<div class="big-icon">📦</div>' +
            '<div class="fname">' + esc(name) + '</div>' +
            '<div class="meta">' + esc(metaParts.join(' · ') || '无法预览') + '</div>' +
            '<div class="hint">' + esc(hint) + '</div>' +
            (path
                ? '<button type="button" class="btn btn-primary" data-dl-path="' + esc(path) + '">下载文件</button>'
                : '') +
        '</div>';
}

document.addEventListener('click', function(e) {
    const btn = e.target.closest && e.target.closest('[data-dl-path]');
    if (!btn) return;
    const p = btn.getAttribute('data-dl-path');
    if (p) downloadWorkspaceFile(p);
});

const SHEET_PREVIEW_MAX_ROWS = 500;
const SHEET_PREVIEW_MAX_COLS = 40;

function openWithSystemApp(path) {
    if (!path) return;
    showLoading('正在用系统程序打开…');
    api('edit', 'POST', {name: path}, d => {
        hideLoading();
        if (d.ok) showToast(d.msg || '已打开', 'success');
        else showToast(d.msg || '打开失败', 'error');
    }, () => { hideLoading(); showToast('打开失败', 'error'); });
}

function sheetAoAToHtml(aoa, truncated) {
    if (!aoa || !aoa.length) {
        return '<div class="sheet-empty">空表</div>';
    }
    let maxCols = 0;
    aoa.forEach(function(row) {
        if (row && row.length > maxCols) maxCols = row.length;
    });
    let html = '<table class="sheet-table"><thead><tr>';
    const header = aoa[0] || [];
    for (let c = 0; c < maxCols; c++) {
        const v = header[c] == null ? '' : header[c];
        html += '<th>' + esc(String(v)) + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (let r = 1; r < aoa.length; r++) {
        const row = aoa[r] || [];
        html += '<tr>';
        for (let c = 0; c < maxCols; c++) {
            const v = row[c] == null ? '' : row[c];
            html += '<td title="' + esc(String(v)) + '">' + esc(String(v)) + '</td>';
        }
        html += '</tr>';
    }
    html += '</tbody></table>';
    if (truncated) {
        html = '<p class="sheet-meta">已截断预览（最多 ' + SHEET_PREVIEW_MAX_ROWS +
            ' 行 / ' + SHEET_PREVIEW_MAX_COLS + ' 列）。完整内容请「用 Excel 打开」。</p>' + html;
    }
    return html;
}

function renderSheetBody(wb, sheetName, bodyEl) {
    const ws = wb.Sheets[sheetName];
    if (!ws) {
        bodyEl.innerHTML = '<div class="sheet-empty">工作表不存在</div>';
        return;
    }
    let truncated = false;
    let range = null;
    try {
        if (ws['!ref']) range = XLSX.utils.decode_range(ws['!ref']);
    } catch (e) { range = null; }
    let opts = { header: 1, defval: '', raw: false };
    if (range) {
        const er = Math.min(range.e.r, range.s.r + SHEET_PREVIEW_MAX_ROWS - 1);
        const ec = Math.min(range.e.c, range.s.c + SHEET_PREVIEW_MAX_COLS - 1);
        if (er < range.e.r || ec < range.e.c) truncated = true;
        opts.range = { s: range.s, e: { r: er, c: ec } };
    }
    const aoa = XLSX.utils.sheet_to_json(ws, opts);
    bodyEl.innerHTML = '<div class="sheet-scroll">' + sheetAoAToHtml(aoa, truncated) + '</div>';
}

function bindSheetTabNav(wrap) {
    if (!wrap) return;
    const tabs = wrap.querySelector('.sheet-tabs');
    const prev = wrap.querySelector('.sheet-nav-prev');
    const next = wrap.querySelector('.sheet-nav-next');
    if (!tabs || !prev || !next) return;

    function updateNav() {
        const max = Math.max(0, tabs.scrollWidth - tabs.clientWidth - 1);
        const need = tabs.scrollWidth > tabs.clientWidth + 2;
        prev.disabled = !need || tabs.scrollLeft <= 1;
        next.disabled = !need || tabs.scrollLeft >= max;
        prev.style.visibility = need ? 'visible' : 'hidden';
        next.style.visibility = need ? 'visible' : 'hidden';
    }

    prev.addEventListener('click', function() {
        tabs.scrollBy({ left: -160, behavior: 'smooth' });
    });
    next.addEventListener('click', function() {
        tabs.scrollBy({ left: 160, behavior: 'smooth' });
    });
    tabs.addEventListener('scroll', updateNav, { passive: true });
    window.addEventListener('resize', updateNav);
    updateNav();
    setTimeout(updateNav, 50);
    return updateNav;
}

function paneFileInfo(name, loadId) {
    const container = getPreviewContainer(name, loadId);
    if (!container) return null;
    const info = parsePreviewKey(name);
    const filePath = container.dataset.filePath || info.path;
    const rev = container.dataset.rev ? Number(container.dataset.rev) : info.rev;
    return { container: container, filePath: filePath, rev: rev };
}

function renderSpreadsheet(name, loadId) {
    if (typeof XLSX === 'undefined') {
        const container = getPreviewContainer(name, loadId);
        if (container) {
            container.innerHTML = '<div class="preview-empty">表格预览库未加载</div>';
            markPaneReady(container, false);
        }
        return;
    }
    const info = paneFileInfo(name, loadId);
    if (!info) return;
    info.container.innerHTML = '<div class="preview-loading"><div class="spinner"></div><div>正在解析表格…</div></div>';
    fetch(rawFileUrl(info.filePath, info.rev))
        .then(function(r) {
            if (!r.ok) throw new Error('读取失败 HTTP ' + r.status);
            return r.arrayBuffer();
        })
        .then(function(buf) {
            const container = getPreviewContainer(name, loadId);
            if (!container) return;
            const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
            const sheets = wb.SheetNames || [];
            if (!sheets.length) {
                container.innerHTML = '<div class="preview-empty">工作簿无工作表</div>';
                markPaneReady(container, true);
                return;
            }
            let tabs = '';
            sheets.forEach(function(sn, i) {
                tabs += '<button type="button" class="sheet-tab' + (i === 0 ? ' active' : '') +
                    '" data-sheet="' + esc(sn) + '" title="' + esc(sn) + '">' + esc(sn) + '</button>';
            });
            container.innerHTML =
                '<div class="sheet-viewer">' +
                    '<div class="sheet-tabs-wrap">' +
                        '<button type="button" class="sheet-nav sheet-nav-prev" title="向左" aria-label="向左">‹</button>' +
                        '<div class="sheet-tabs">' + tabs + '</div>' +
                        '<button type="button" class="sheet-nav sheet-nav-next" title="向右" aria-label="向右">›</button>' +
                    '</div>' +
                    '<div class="sheet-body"></div>' +
                '</div>';
            const wrap = container.querySelector('.sheet-tabs-wrap');
            const tabsEl = container.querySelector('.sheet-tabs');
            const bodyEl = container.querySelector('.sheet-body');
            const updateNav = bindSheetTabNav(wrap);
            renderSheetBody(wb, sheets[0], bodyEl);
            container.querySelectorAll('.sheet-tab').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    container.querySelectorAll('.sheet-tab').forEach(function(b) {
                        b.classList.toggle('active', b === btn);
                    });
                    renderSheetBody(wb, btn.getAttribute('data-sheet'), bodyEl);
                    try { btn.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' }); } catch (e) {}
                    if (updateNav) setTimeout(updateNav, 80);
                });
            });
            if (tabsEl && tabsEl.firstElementChild) {
                try { tabsEl.firstElementChild.scrollIntoView({ inline: 'nearest', block: 'nearest' }); } catch (e) {}
            }
            markPaneReady(container, true);
        })
        .catch(function(err) {
            const container = getPreviewContainer(name, loadId);
            if (!container) return;
            const filePath = parsePreviewKey(name).path;
            container.innerHTML = '<div class="preview-empty">表格预览失败: ' +
                esc(err && err.message ? err.message : String(err)) +
                '<div style="margin-top:0.75rem"><button type="button" class="btn btn-primary" data-open-sys="' +
                esc(filePath) + '">用 Excel 打开</button></div></div>';
            markPaneReady(container, false);
            const openBtn = container.querySelector('[data-open-sys]');
            if (openBtn) {
                openBtn.addEventListener('click', function() {
                    openWithSystemApp(filePath);
                });
            }
        });
}

function renderDocx(name, loadId) {
    const info = paneFileInfo(name, loadId);
    if (!info) return;
    fetch(rawFileUrl(info.filePath, info.rev))
        .then(r => r.arrayBuffer())
        .then(buf => {
            const container = getPreviewContainer(name, loadId);
            if (!container) return null;
            container.innerHTML = '';
            return docx.renderAsync(buf, container, null, {
                className: 'docx-content',
                inWrapper: true,
                ignoreWidth: false,
                ignoreHeight: true,
                breakPages: true,
                experimental: true
            }).then(function() {
                markPaneReady(getPreviewContainer(name, loadId), true);
            });
        })
        .catch(err => {
            const container = getPreviewContainer(name, loadId);
            if (!container) return;
            container.innerHTML = '<div class="preview-empty">Word 文档渲染失败: ' +
                (err.message || err) + '</div>';
            markPaneReady(container, false);
        });
}

function renderMarkdown(name, loadId) {
    const info = paneFileInfo(name, loadId);
    if (!info) return;
    fetch(rawFileUrl(info.filePath, info.rev))
        .then(r => r.text())
        .then(text => {
            const container = getPreviewContainer(name, loadId);
            if (!container) return;
            if (typeof marked !== 'undefined' && marked.parse) {
                container.innerHTML = marked.parse(text);
            } else {
                container.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit;margin:0">' +
                    text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>';
            }
            markPaneReady(container, true);
        })
        .catch(err => {
            const container = getPreviewContainer(name, loadId);
            if (!container) return;
            container.innerHTML = '<div class="preview-empty">Markdown 渲染失败: ' +
                (err.message || err) + '</div>';
            markPaneReady(container, false);
        });
}

    const iconEl = document.getElementById('detailIcon');

    let badges = '<span class="detail-badge">' + (isDir ? '文件夹' : '文件') + '</span>';

        cards += '<div class="detail-card"><div class="k">修改时间</div><div class="v">' + esc(time || '—') + '</div></div>';
        cards += '<div class="detail-card span-2"><div class="k">版本状态</div><div class="v">' + esc(status || '—') + '</div></div>';

    } else {

function ctxAction(act) {
    hideCtxMenu();
    const sel = primarySelection();
    if (act === 'detail') showItemDetail();
    else if (act === 'history') {
        if (sel.path) showPathHistory(sel.path, sel.type === 'dir');
    }
    else if (act === 'mkdir') showMkdirDialog();
    else if (act === 'upload') {
        uploadTargetDir = (sel.type === 'dir' && sel.path != null) ? sel.path : '';
        document.getElementById('fileInput').click();
    }
    else if (act === 'reveal') {
        openExplorer('item', sel.path || '');
    }
    else if (act === 'rename') showRenameDialog();
    else if (act === 'move') showMoveDialog();
    else if (act === 'delete') deleteSelected();
}

function uploadFiles(input) {
    const files = input.files;
    if (!files || files.length === 0) return;
    if (!workspaceReady) { showToast('工作区未就绪', 'error'); input.value = ''; return; }
    let done = 0;
    let failed = 0;
    const destDir = uploadTargetDir || '';
    showLoading('正在上传 0/' + files.length + '...');
    for (const f of files) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const b64 = e.target.result.split(',')[1];
            api('upload', 'POST', {name: f.name, data: b64, dir: destDir}, d => {
                done++;
                if (!d.ok) failed++;
                document.getElementById('globalLoadingMsg').textContent =
                    '正在上传 ' + done + '/' + files.length + '...';
                if (done === files.length) {
                    hideLoading();
                    input.value = '';
                    uploadTargetDir = '';
                    if (destDir) expandedDirs[destDir] = true;
                    refresh();
                    if (failed) showToast('上传完成，失败 ' + failed + ' 个', 'error');
                    else showToast('已上传 ' + files.length + ' 个文件' + (destDir ? ('到 /' + destDir) : '到根目录'), 'success');
                }
            }, () => {
                done++;
                failed++;
                document.getElementById('globalLoadingMsg').textContent =
                    '正在上传 ' + done + '/' + files.length + '...';
                if (done === files.length) {
                    hideLoading();
                    input.value = '';
                    uploadTargetDir = '';
                    refresh();
                    showToast('上传完成，失败 ' + failed + ' 个', 'error');
                }
            });
        };
        reader.onerror = function() {
            done++;
            failed++;
            if (done === files.length) {
                hideLoading();
                input.value = '';
                refresh();
                showToast('上传完成，失败 ' + failed + ' 个', 'error');
            }
        };
        reader.readAsDataURL(f);
    }
}

/**
 * 统一文件历史操作：预览 → 对比 → 下载 → 恢复
 * contentRev：可读内容所在修订（删除项指向删除前一版）
 */
function fileRevActionsHtml(path, rev, kind, opts) {
    opts = opts || {};
    const compact = !!opts.compact;
    const ep = esc(path);
    const prev = findPrevRev(rev);
    const contentRev = (kind === 'deleted') ? prev : rev;
    const canRead = contentRev != null && contentRev > 0;
    const canDiff = kind === 'modified' || kind === 'deleted' || kind === 'added';

    function btn(act, label, cls, r, title, actKind) {
        if (r == null || r < 1) return '';
        return '<button type="button" class="btn btn-sm ' + cls + '" data-act="' + act +
            '" data-path="' + ep + '" data-rev="' + r + '" data-kind="' + (actKind || 'at') + '"' +
            (title ? ' title="' + esc(title) + '"' : '') + '>' + label + '</button>';
    }

    let html = '';
    if (canRead) {
        html += btn('preview', compact ? '预览' : '预览此版', 'btn-default', contentRev,
            '在预览区打开 r' + contentRev + ' 的内容', 'at');
    }
    if (canDiff) {
        const diffLabel = compact ? '对比' : '对比上一版';
        html += btn('diff', diffLabel, 'btn-default', rev,
            '与上一修订对比；可在对比窗下载两端', kind);
    }
    if (canRead) {
        html += btn('dl', compact ? '下载' : '下载此版', 'btn-default', contentRev,
            '下载 r' + contentRev + ' 的文件', 'at');
    }
    if (canRead) {
        html += btn('restore', compact ? '恢复' : '恢复到工作区', 'btn-default', contentRev,
            '仅覆盖工作区中的此文件，不会整库回滚', 'at');
    }
    return html || '<span style="color:var(--muted);font-size:0.75rem">无可用操作</span>';
}

function renderGroupedChanges(changes, revNum) {
    if (!changes) return '<div class="change-empty">无变更明细</div>';
    const groups = [
        { key: 'added', label: '新增', cls: 'a', mark: '+ A' },
        { key: 'modified', label: '修改', cls: 'm', mark: '~ M' },
        { key: 'deleted', label: '删除', cls: 'd', mark: '- D' },
    ];
    let html = '';
    let any = false;
    const rev = Number(revNum);
    groups.forEach(g => {
        const list = changes[g.key] || [];
        if (!list.length) return;
        any = true;
        html += '<div class="hist-file-group">';
        html += '<div class="group-title ' + g.cls + '">' + g.label + '（' + list.length + '）</div>';
        html += '<div class="hist-file-list">';
        list.forEach(p => {
            html += '<div class="chg-line chg-' + g.cls + '">' +
                '<span class="chg-path" title="' + esc(p) + '">' + g.mark + '  ' + esc(p) + '</span>' +
                '<span class="chg-acts">' + fileRevActionsHtml(p, rev, g.key, { compact: true }) + '</span>' +
                '</div>';
        });
        html += '</div></div>';
    });
    if (!any) return '<div class="change-empty">本次提交无文件变更记录</div>';
    return html;
}

// 历史详情内按钮：用 data-*，避免中文路径破坏 onclick 引号
document.addEventListener('click', function(e) {
    const btn = e.target.closest && e.target.closest('#historyDetail [data-act]');
    if (!btn) return;
    e.stopPropagation();
    const act = btn.getAttribute('data-act');
    const path = btn.getAttribute('data-path');
    const rev = Number(btn.getAttribute('data-rev'));
    const kind = btn.getAttribute('data-kind');
    if (!path || !Number.isFinite(rev) || rev < 0) return;
    if (act === 'dl') downloadRevFile(path, rev, kind);
    else if (act === 'diff') diffRevFile(path, rev, kind);
    else if (act === 'preview') openPreviewAtRev(path, rev);
    else if (act === 'restore') doRestorePath(path, rev);
});

function downloadRevFile(path, rev, changeKind) {
    // kind === 'at'：按给定 rev 精确下载；deleted 兼容旧调用时回退上一修订
    let targetRev = Number(rev);
    if (changeKind === 'deleted') {
        const prev = findPrevRev(targetRev);
        if (prev == null) {
            showToast('没有更早的修订可下载该文件', 'error');
            return;
        }
        targetRev = prev;
    }
    if (!targetRev || targetRev < 1) {
        showToast('无效修订号', 'error');
        return;
    }
    const url = '/api/rev_file?rev=' + encodeURIComponent(targetRev) +
        '&file=' + encodeURIComponent(path);
    const base = String(path).split('/').pop() || 'file';
    const saveName = 'r' + targetRev + '_' + base;
    showLoading('正在导出 r' + targetRev + ' …');
    fetch(url).then(function(r) {
        if (!r.ok) {
            return r.json().then(function(j) {
                throw new Error((j && j.error) || ('HTTP ' + r.status));
            }).catch(function(e) {
                if (e && e.message && e.message.indexOf('HTTP') === 0) throw e;
                throw new Error((e && e.message) || ('HTTP ' + r.status));
            });
        }
        return r.blob();
    }).then(function(blob) {
        hideLoading();
        const a = document.createElement('a');
        const obj = URL.createObjectURL(blob);
        a.href = obj;
        a.download = saveName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(obj); }, 2000);
        document.getElementById('statusBar').textContent = '已导出 ' + saveName;
    }).catch(function(err) {
        hideLoading();
        showToast('下载失败: ' + (err && err.message ? err.message : err), 'error');
    });
}

function findPrevRev(rev) {
    const v = historyCache.find(function(x) { return Number(x.version) === Number(rev); });
    if (v && v.prev_revision != null) return Number(v.prev_revision);
    const earlier = historyCache
        .map(function(x) { return x.version; })
        .filter(function(n) { return n < rev; });
    return earlier.length ? Math.max.apply(null, earlier) : null;
}

function diffRevFile(path, rev, changeKind) {
    let fromRev, toRev;
    if (changeKind === 'added') {
        // 相对空 → 本修订
        fromRev = 'empty';
        toRev = rev;
        // API 不支持 empty，用一个不存在的伪修订无法工作；改为 from=prev（文件不存在）或直接 to 与空
        // 实现：from 用 prev（若无则用特殊），后端 missing 一侧即可
        const prev = findPrevRev(rev);
        fromRev = prev != null ? prev : 0; // r0 视为不存在
        toRev = rev;
    } else if (changeKind === 'deleted') {
        const prev = findPrevRev(rev);
        if (prev == null) {
            showToast('没有更早修订可对比', 'error');
            return;
        }
        fromRev = prev;
        toRev = rev; // 本修订已删除 → to missing
    } else {
        // modified
        const prev = findPrevRev(rev);
        if (prev == null) {
            showToast('没有更早修订可对比', 'error');
            return;
        }
        fromRev = prev;
        toRev = rev;
    }
    openDiffModal(path, fromRev, toRev);
}

function openDiffModal(path, fromRev, toRev) {
    document.getElementById('diffTitle').textContent = '对比 · ' + path;
    document.getElementById('diffMeta').textContent = '加载中…';
    document.getElementById('diffBody').innerHTML = '<div class="diff-empty">正在生成对比…</div>';
    document.getElementById('diffDlFrom').style.display = 'none';
    document.getElementById('diffDlTo').style.display = 'none';
    document.getElementById('diffModal').classList.add('show');

    const q = 'diff?file=' + encodeURIComponent(path) +
        '&from=' + encodeURIComponent(fromRev) +
        '&to=' + encodeURIComponent(toRev);
    api(q, 'GET', null, d => {
        if (!d.ok) {
            document.getElementById('diffMeta').textContent = d.msg || '对比失败';
            document.getElementById('diffBody').innerHTML =
                '<div class="diff-empty">' + esc(d.msg || '对比失败') + '</div>';
            return;
        }
        let meta = esc(d.from_label) + ' → ' + esc(d.to_label);
        if (d.mode === 'binary') {
            meta += ' · 二进制';
        } else if (d.identical) {
            meta += ' · 内容相同';
        } else if (d.stats) {
            meta += ' · +' + d.stats.added + ' / -' + d.stats.removed + ' 行';
        }
        if (d.from_size != null || d.to_size != null) {
            meta += ' · ' + formatBytes(d.from_size || 0) + ' → ' + formatBytes(d.to_size || 0);
        }
        document.getElementById('diffMeta').textContent = meta;

        const btnFrom = document.getElementById('diffDlFrom');
        const btnTo = document.getElementById('diffDlTo');
        if (!d.from_missing && /^\d+$/.test(String(fromRev)) && Number(fromRev) > 0) {
            btnFrom.style.display = '';
            btnFrom.textContent = '下载修改前 ' + d.from_label;
            btnFrom.onclick = function() {
                downloadRevFile(path, Number(fromRev), 'at');
            };
        }
        if (!d.to_missing && /^\d+$/.test(String(toRev)) && Number(toRev) > 0) {
            btnTo.style.display = '';
            btnTo.textContent = '下载修改后 ' + d.to_label;
            btnTo.onclick = function() {
                downloadRevFile(path, Number(toRev), 'at');
            };
        }

        if (d.mode === 'binary') {
            document.getElementById('diffBody').innerHTML =
                '<div class="diff-empty">' + esc(d.msg || '二进制文件无法文本对比') +
                '<br><br>请使用下方按钮分别下载两端版本</div>';
            return;
        }
        if (d.identical || !d.unified) {
            document.getElementById('diffBody').innerHTML =
                '<div class="diff-empty">' + esc(d.msg || '两端内容相同') + '</div>';
            return;
        }
        document.getElementById('diffBody').innerHTML = renderUnifiedDiff(d.unified);
    }, () => {
        document.getElementById('diffMeta').textContent = '请求失败';
        document.getElementById('diffBody').innerHTML = '<div class="diff-empty">请求失败</div>';
    });
}

function formatBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderUnifiedDiff(text) {
    const lines = String(text || '').split('\n');
    let html = '';
    lines.forEach(line => {
        let cls = 'ctx';
        if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@')) cls = 'dh';
        else if (line.startsWith('+')) cls = 'add';
        else if (line.startsWith('-')) cls = 'del';
        html += '<div class="diff-line ' + cls + '">' + esc(line || ' ') + '</div>';
    });
    return html || '<div class="diff-empty">无差异输出</div>';
}

function showSaveDialog() { showCommitModal(); }
function showHistory() { showHistoryModal(); }

function updateHistoryScopeBar() {
    const bar = document.getElementById('historyScopeBar');
    const label = document.getElementById('historyScopeLabel');
    const title = document.getElementById('historyTitle');
    if (!bar || !label || !title) return;
    if (historyScopePath) {
        bar.classList.add('show');
        const shown = '/' + historyScopePath + (historyScopeIsDir ? '/' : '');
        label.textContent = shown;
        label.title = shown;
        title.textContent = historyScopeIsDir ? '目录历史' : '文件历史';
    } else {
        bar.classList.remove('show');
        label.textContent = '';
        label.title = '';
        title.textContent = '修订历史';
    }
}

function clearHistoryScope() {
    historyScopePath = '';
    historyScopeIsDir = false;
    selectedHistoryVer = null;
    updateHistoryScopeBar();
    loadHistoryPanel();
}

function showPathHistory(path, isDir) {
    if (!path) {
        showHistoryModal();
        return;
    }
    historyScopePath = String(path).replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
    historyScopeIsDir = !!isDir;
    selectedHistoryVer = null;
    document.getElementById('historyModal').classList.add('show');
    updateHistoryScopeBar();
    loadHistoryPanel();
}

function showCommitModal() {
    if (document.getElementById('toolbarCommitBtn').disabled) {
        showToast('没有需要提交的变更', 'error');
        return;
    }
    document.getElementById('pendingSummary').textContent = '正在检查工作区变更…';
    document.getElementById('pendingChanges').innerHTML = '';
    document.getElementById('saveVersionBtn').disabled = true;
    document.getElementById('commitModal').classList.add('show');
    loadCommitPanel();
}

function showHistoryModal() {
    historyScopePath = '';
    historyScopeIsDir = false;
    selectedHistoryVer = null;
    updateHistoryScopeBar();
    document.getElementById('historyModal').classList.add('show');
    loadHistoryPanel();
}

function loadCommitPanel() {
    document.getElementById('pendingSummary').textContent = '正在检查工作区变更…';
    document.getElementById('pendingChanges').innerHTML = '';
    document.getElementById('saveVersionBtn').disabled = true;
    api('pending_changes', 'GET', null, d => {
        applyPendingToToolbar(d);
        if (!d.ok) {
            document.getElementById('pendingSummary').textContent = d.msg || '无法获取变更';
            return;
        }
        if (!d.has_changes) {
            document.getElementById('pendingSummary').textContent = '工作区干净，没有需要提交的变更';
            document.getElementById('pendingChanges').innerHTML = '<div class="change-empty">与 HEAD 一致</div>';
            document.getElementById('saveVersionBtn').disabled = true;
            return;
        }
        const parts = [];
        if (d.added.length) parts.push('新增 ' + d.added.length);
        if (d.modified.length) parts.push('修改 ' + d.modified.length);
        if (d.deleted.length) parts.push('删除 ' + d.deleted.length);
        document.getElementById('pendingSummary').textContent =
            (d.is_first ? '首次提交 · ' : '相对 HEAD r' + (d.head_revision || 0) + ' · ') +
            parts.join('，') + '（跟踪 ' + d.total_files + ' 个文件）';
        document.getElementById('pendingChanges').innerHTML = renderChangeLines(d);
        document.getElementById('saveVersionBtn').disabled = false;
        setTimeout(() => document.getElementById('noteInput').focus(), 80);
    }, () => {
        document.getElementById('pendingSummary').textContent = '检查变更失败';
    });
}

function doSaveVersion() {
    const note = document.getElementById('noteInput').value.trim();
    if (!note) {
        showToast('请填写提交说明', 'error');
        document.getElementById('noteInput').focus();
        return;
    }
    showLoading('正在提交修订…');
    api('save_version', 'POST', {note: note}, d => {
        hideLoading();
        if (d.ok) {
            document.getElementById('noteInput').value = '';
            closeModal('commitModal');
            showToast(d.msg, 'success');
            refresh();
            showHistoryModal();
        } else showToast(d.msg, 'error');
    }, () => { hideLoading(); showToast('提交失败', 'error'); });
}

function pathStatusLabel(status) {
    if (status === 'added') return { cls: 'a', text: '新增' };
    if (status === 'modified') return { cls: 'm', text: '修改' };
    if (status === 'deleted') return { cls: 'd', text: '删除' };
    return null;
}

function loadHistoryPanel() {
    const list = document.getElementById('historyList');
    const detail = document.getElementById('historyDetail');
    const countEl = document.getElementById('historyCount');
    list.innerHTML = '<div class="change-empty">加载修订历史…</div>';
    detail.innerHTML = '<div class="hist-detail-empty">加载中…</div>';
    countEl.textContent = '';
    updateHistoryScopeBar();
    let url = 'history';
    if (historyScopePath) url += '?path=' + encodeURIComponent(historyScopePath);
    api(url, 'GET', null, data => {
        historyCache = data.history || [];
        if (!historyCache.length) {
            list.innerHTML = '<div class="change-empty">' +
                (historyScopePath ? '该路径尚无相关修订' : '暂无修订历史') + '</div>';
            detail.innerHTML = '<div class="hist-detail-empty">' +
                (historyScopePath ? '此路径在历史提交中没有出现过变更' : '提交后将在这里显示修订详情') +
                '</div>';
            countEl.textContent = historyScopePath ? '范围内 0 条' : '0 条修订';
            return;
        }
        countEl.textContent = (historyScopePath ? '范围内 ' : '共 ') + historyCache.length + ' 条修订';
        let html = '';
        historyCache.forEach(v => {
            const note = (v.note || '').trim() || '（无说明）';
            const st = pathStatusLabel(v.path_status);
            html += '<div class="hist-row" data-ver="' + v.version + '" onclick="selectHistoryRev(' + v.version + ')">' +
                '<div class="rev">r' + v.version +
                    (st ? '<span class="path-status ' + st.cls + '">' + st.text + '</span>' : '') +
                '</div>' +
                '<div class="meta">' +
                    '<div class="note" title="' + esc(note) + '">' + esc(note) + '</div>' +
                    '<div class="time">' + esc(v.time || '') + '</div>' +
                    '<div class="chips">' + changeChipsHtml(v.changes) + '</div>' +
                '</div>';
            html += '</div>';
        });
        list.innerHTML = html;
        const pick = selectedHistoryVer && historyCache.some(v => v.version === selectedHistoryVer)
            ? selectedHistoryVer
            : historyCache[0].version;
        selectHistoryRev(pick);
    }, () => {
        list.innerHTML = '<div class="change-empty">加载历史失败</div>';
        detail.innerHTML = '<div class="hist-detail-empty">加载失败</div>';
    });
}

function selectHistoryRev(ver) {
    selectedHistoryVer = ver;
    document.querySelectorAll('.hist-row').forEach(row => {
        row.classList.toggle('active', Number(row.dataset.ver) === Number(ver));
    });
    const v = historyCache.find(x => Number(x.version) === Number(ver));
    const detail = document.getElementById('historyDetail');
    if (!v) {
        detail.innerHTML = '<div class="hist-detail-empty">未找到该修订</div>';
        return;
    }
    const note = (v.note || '').trim();
    const changes = v.changes || {};
    const nA = (changes.added || []).length;
    const nM = (changes.modified || []).length;
    const nD = (changes.deleted || []).length;
    const total = nA + nM + nD;
    const st = pathStatusLabel(v.path_status);
    const fileScope = !!(historyScopePath && !historyScopeIsDir);

    let html = '<div class="hist-detail-body">';
    html += '<div class="hist-detail-title">' +
        '<span class="rev-big">r' + v.version + '</span>' +
        (st ? '<span class="path-status ' + st.cls + '">' + st.text + '</span>' : '') +
        '<span class="when">' + esc(v.time || '') + '</span>' +
        '</div>';
    html += '<div class="hist-detail-note' + (note ? '' : ' empty') + '">' +
        esc(note || '本次提交未填写说明') + '</div>';

    if (fileScope) {
        const kind = v.path_status || (nM ? 'modified' : (nA ? 'added' : 'deleted'));
        html += '<div class="hist-section-label">本文件操作</div>';
        html += '<div class="hist-file-card">';
        html += '<div class="fname" title="' + esc(historyScopePath) + '">' + esc(historyScopePath) + '</div>';
        html += '<div class="acts">' + fileRevActionsHtml(historyScopePath, v.version, kind, { compact: false }) + '</div>';
        html += '<div class="hist-act-hint">预览 / 下载看历史内容；对比看差异（对比窗可下载两端）；恢复只改工作区里这一份文件。</div>';
        html += '</div>';
    } else {
        html += '<div class="hist-section-label">变更文件 <span class="chips">' +
            changeChipsHtml(changes) + '</span>' +
            '<span style="font-weight:400;color:var(--muted)">共 ' + total + ' 项</span></div>';
        html += renderGroupedChanges(changes, v.version);
        html += '<div class="hist-act-hint">每个文件统一为：预览 → 对比 → 下载 → 恢复（恢复仅覆盖该文件）。</div>';
    }

    if (!historyScopePath) {
        html += '<div class="hist-detail-actions">' +
            '<button type="button" class="btn btn-danger" onclick="doRollback(' + v.version + ')">整库回滚到此修订</button>' +
            '<span style="font-size:var(--fs-sm);color:var(--muted);align-self:center">覆盖整个工作区，与上方「恢复」单文件不同</span>' +
            '</div>';
    } else {
        html += '<div class="hist-detail-actions">' +
            '<span style="font-size:var(--fs-sm);color:var(--muted)">当前为路径历史，不提供整库回滚。需要时可点「查看全部修订」。</span>' +
            '</div>';
    }
    html += '</div>';
    detail.innerHTML = html;
}

function doRollback(ver) {
    if (confirm('确定将【整个工作区】恢复到修订 r' + ver + ' 吗？\n未提交修改将被全部覆盖。\n（若只想恢复单个文件，请用文件上的「恢复」）')) {
        showLoading('正在恢复到 r' + ver + '…');
        api('rollback', 'POST', {version: ver}, d => {
            hideLoading();
            if (d.ok) {
                closeModal('historyModal');
                refresh();
                showToast(d.msg, 'success');
            } else showToast(d.msg, 'error');
        }, () => { hideLoading(); showToast('恢复失败', 'error'); });
    }
}

function doRestorePath(path, rev) {
    if (!path || !rev) return;
    if (!confirm('确定把「' + path + '」恢复为 r' + rev + ' 的内容吗？\n只改这一个文件，其它文件不动。')) {
        return;
    }
    showLoading('正在恢复文件…');
    api('restore_path', 'POST', {version: rev, path: path}, d => {
        hideLoading();
        if (d.ok) {
            showToast(d.msg, 'success');
            refresh();
            openPreviewTab(path);
        } else showToast(d.msg, 'error');
    }, () => { hideLoading(); showToast('恢复失败', 'error'); });
}

// 中间分割条拖拽调整左右面板宽度
(function initSplitter() {
    const splitter = document.getElementById('splitter');
    const filePanel = document.getElementById('filePanel');
    const main = document.querySelector('.main');
    if (!splitter || !filePanel || !main) return;

    let dragging = false;

    splitter.addEventListener('mousedown', function(e) {
        e.preventDefault();
        dragging = true;
        splitter.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        const rect = main.getBoundingClientRect();
        let pct = ((e.clientX - rect.left) / rect.width) * 100;
        if (pct < 15) pct = 15;
        if (pct > 70) pct = 70;
        filePanel.style.width = pct + '%';
        filePanel.style.minWidth = '0';
        filePanel.style.maxWidth = 'none';
    });

    document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false;
        splitter.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });
})();

// 从资源管理器改完文件回到窗口时，静默更新状态（不重载预览）
window.addEventListener('focus', function() { refreshQuiet(); });
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') refreshQuiet();
});
// 定时只刷新待提交统计，避免整页闪烁
setInterval(function() {
    if (document.visibilityState === 'visible' && workspaceReady && loadingCount === 0) {
        refreshVersionToolbar();
    }
}, 15000);

document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    hideCtxMenu();
    hidePtabCtxMenu();
    if (isPreviewFullscreen()) {
        // 有弹窗时优先关弹窗，不顺带退全屏
        const openModal = document.querySelector('.modal-overlay.show');
        if (openModal) return;
        setPreviewFullscreen(false);
    }
});

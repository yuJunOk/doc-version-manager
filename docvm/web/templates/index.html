<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档版本管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --line: #dde3ea;
    --text: #1f2a33;
    --muted: #6b7785;
    --accent: #2f6fed;
    --accent-soft: #e8f0fe;
    --ok: #1a7f4b;
    --warn: #b86e00;
    --danger: #c0392b;
    --header: #1e3a5f;
    --fs: clamp(0.75rem, 0.7rem + 0.2vw, 0.875rem);
    --fs-sm: clamp(0.6875rem, 0.65rem + 0.15vw, 0.8125rem);
    --pad: clamp(0.5rem, 0.8vw, 1rem);
    --radius: 0.5rem;
}
body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; font-size: var(--fs);
}
header {
    background: var(--header); color: white;
    padding: 0.65rem 1.25rem; display: flex;
    align-items: center; justify-content: space-between;
    flex-shrink: 0;
}
header .brand { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
header h1 { font-size: 1rem; font-weight: 650; letter-spacing: 0.02em; flex-shrink: 0; }
header .head-badge {
    font-size: var(--fs-sm); background: rgba(255,255,255,0.14);
    padding: 0.2em 0.6em; border-radius: 0.3rem; font-weight: 500;
    color: rgba(255,255,255,0.92); flex-shrink: 0;
}
header .btn-refresh {
    margin-left: 0.15rem;
    padding: 0.28em 0.75em;
    font-size: var(--fs-sm);
    font-weight: 550;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 0.35rem;
    gap: 0.35em;
}
header .btn-refresh:hover:not(:disabled) {
    background: rgba(255,255,255,0.22);
    border-color: rgba(255,255,255,0.45);
    color: #fff;
}
header .btn-refresh:active:not(:disabled) {
    background: rgba(255,255,255,0.28);
}
header .btn-refresh .ico-svg { width: 0.85rem; height: 0.85rem; opacity: 0.95; }
.footer-bar {
    background: #e8edf2; border-top: 1px solid var(--line);
    padding: 0.35rem 0.85rem; font-size: var(--fs-sm);
    color: var(--muted); flex-shrink: 0;
    display: flex; align-items: center; gap: 0.55rem; flex-wrap: nowrap;
    min-height: 2rem; overflow: hidden;
}
.footer-bar .foot-msg {
    color: #4a5560; font-weight: 550; flex-shrink: 0;
    max-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.footer-bar .foot-sep {
    width: 1px; height: 0.9rem; background: #cfd6dd; flex-shrink: 0;
}
.footer-bar .path-item {
    display: inline-flex; align-items: center; gap: 0.25rem; min-width: 0; max-width: 9.5rem;
}
.footer-bar .path-label { color: var(--muted); flex-shrink: 0; }
.footer-bar .path-link {
    color: var(--accent); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.footer-bar .path-link.empty { color: var(--muted); cursor: default; }
.footer-bar .stats {
    color: var(--muted); margin-left: auto; flex-shrink: 0;
    white-space: nowrap;
}
.toolbar {
    background: var(--surface); padding: 0.5rem 1rem; display: flex;
    gap: 0.4rem; border-bottom: 1px solid var(--line);
    flex-wrap: wrap; align-items: center; flex-shrink: 0;
}
.toolbar .group-label {
    font-size: var(--fs-sm); color: var(--muted); margin-right: 0.15rem;
}
.toolbar-commit {
    display: inline-flex; align-items: center; gap: 0.5rem;
    flex-shrink: 0; min-width: 0;
}
.commit-status {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.3em 0.7em; border-radius: 999px;
    font-size: var(--fs-sm); font-weight: 650;
    white-space: nowrap; flex-shrink: 0;
    border: 1px solid transparent;
}
.commit-status .dot {
    width: 0.55rem; height: 0.55rem; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
}
.commit-status.is-clean {
    background: #e6f6ec; color: var(--ok); border-color: #b7e4c7;
}
.commit-status.is-dirty {
    background: #fff4e0; color: var(--warn); border-color: #f0d090;
    animation: commitPulse 1.2s ease-in-out infinite;
}
.commit-status.is-unknown {
    background: #eef1f4; color: var(--muted); border-color: var(--line);
}
@keyframes commitPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184, 110, 0, 0.35); }
    50% { box-shadow: 0 0 0 0.35rem rgba(184, 110, 0, 0.12); }
}
.pending-summary {
    font-size: var(--fs-sm); color: var(--muted);
    max-width: min(22vw, 14rem);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 0 1 auto; min-width: 0;
}
.pending-summary.has-changes { color: var(--warn); font-weight: 550; }
.pending-summary.clean { color: var(--ok); }
.pending-summary.hidden { display: none; }
#toolbarCommitBtn { flex-shrink: 0; }
.btn {
    padding: 0.4em 0.85em; border: 1px solid var(--line); border-radius: 0.35rem;
    cursor: pointer; font-size: var(--fs-sm); font-weight: 500;
    background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; gap: 0.35em;
    font-family: inherit;
}
.btn:hover:not(:disabled) { background: #f5f7fa; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: #245cd4; color: #fff; }
.btn-success { background: var(--ok); color: white; border-color: var(--ok); }
.btn-success:hover:not(:disabled) { background: #156b3d; color: #fff; border-color: #156b3d; }
.btn-danger { background: #fff; color: var(--danger); border-color: #f0c2c2; }
.btn-danger:hover:not(:disabled) { background: #fff5f5; color: var(--danger); }
.btn-default { background: #f5f7fa; }
.btn-default:hover:not(:disabled) { background: #e8edf2; }
.btn-sm { padding: 0.25em 0.65em; font-size: 0.72rem; }
.separator { width: 1px; height: 1.4rem; background: var(--line); margin: 0 0.25rem; }
.main {
    flex: 1; display: flex; overflow: hidden;
    padding: 0.5rem 0.55rem 0.5rem 0.35rem; gap: 0;
    min-height: 0;
}
.file-panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius) 0 0 var(--radius);
    display: flex; flex-direction: column; overflow: hidden;
    width: 25%; min-width: 12rem; max-width: 70%; flex-shrink: 0;
}
/* 窄文件区：收紧左边距，把宽度留给文件名 */
.file-panel > .panel-header {
    padding: 0.4rem 0.4rem 0.4rem 0.45rem; gap: 0.35rem;
}
.file-panel .file-search input {
    padding: 0.25em 1.55em 0.25em 0.45em;
}
.file-tree-ops {
    display: inline-flex; align-items: center; gap: 0.1rem; flex-shrink: 0;
}
.file-tree-ops .btn-tree-op {
    width: 1.45rem; height: 1.45rem; padding: 0; margin: 0;
    font-size: 0; line-height: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--muted);
    border: 1px solid transparent; border-radius: 0.35rem;
    box-shadow: none; cursor: pointer;
}
.file-tree-ops .btn-tree-op:hover:not(:disabled) {
    background: #e8edf2; color: var(--accent); border-color: transparent;
}
.file-tree-ops .btn-tree-op .ico-svg { width: 0.88rem; height: 0.88rem; }
.file-panel .tree-header,
.file-panel .tree-row,
.file-panel .tree-row.root-drop {
    padding-left: 0.4rem; padding-right: 0.35rem;
    grid-template-columns: minmax(0, 1fr) 6.6rem 2.35rem;
    gap: 0.3rem;
}
.file-panel .tree-header { padding-top: 0.3rem; padding-bottom: 0.3rem; }
.file-panel .tree-row { padding-top: 0.28rem; padding-bottom: 0.28rem; }
.file-panel .tree-row .meta {
    font-size: 0.68rem; letter-spacing: -0.01em;
}
.file-panel .tree-row .status { font-size: 0.68rem; }
.file-panel .tree-row .label { gap: 0.15rem; }
.file-panel .tree-row .twist { width: 0.85rem; }
.file-panel .file-actions {
    padding: 0.35rem 0.4rem;
}
.file-panel .file-actions .hint { font-size: 0.68rem; }
.splitter {
    width: 0.35rem; background: transparent; cursor: col-resize;
    flex-shrink: 0; z-index: 10; position: relative;
}
.splitter::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 40%;
    width: 1px; background: var(--line);
}
.splitter:hover::after, .splitter.dragging::after { background: var(--accent); width: 2px; left: 30%; }
.panel-header {
    padding: 0.5rem 0.75rem; font-weight: 600; font-size: 0.85rem;
    background: #f7f9fb; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    flex-shrink: 0;
}
.panel-header .title { flex-shrink: 0; }
.panel-header .sub {
    font-weight: 400; color: var(--muted); font-size: var(--fs-sm); margin-left: 0.4rem;
}
.panel-header .header-actions { display: flex; gap: 0.25rem; flex-shrink: 0; align-items: center; min-width: 0; }
.panel-header .header-actions .btn { padding: 0.15em 0.55em; font-size: var(--fs-sm); }
.file-panel .panel-header .title { flex: 0 0 auto; }

/* 预览栏：左全屏+标题，右工具组 */
.work-panel > .panel-header {
    gap: 0.65rem;
    padding: 0.4rem 0.65rem 0.4rem 0.45rem;
}
.preview-head-left {
    display: flex; align-items: center; gap: 0.35rem;
    flex: 1; min-width: 0;
}
.preview-head-left .title {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 650;
}
.preview-head-left .sub {
    display: inline; margin-left: 0.35rem;
    overflow: hidden; text-overflow: ellipsis;
}
.btn-fullscreen {
    width: 1.55rem; height: 1.55rem; padding: 0; margin: 0;
    font-size: 0; line-height: 0; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--muted);
    border: 1px solid transparent; border-radius: 0.35rem;
    box-shadow: none; cursor: pointer;
}
.btn-fullscreen:hover:not(:disabled) {
    background: #e8edf2; color: var(--accent); border-color: transparent;
}
.btn-fullscreen.is-exit {
    color: var(--danger);
}
.btn-fullscreen.is-exit:hover:not(:disabled) {
    background: #fdecea; color: #a93226;
}
.work-panel.fullscreen > .panel-header {
    background: #1e3a5f; color: #fff;
    padding: 0.5rem 0.85rem 0.5rem 0.55rem;
}
.work-panel.fullscreen .preview-head-left .sub { color: rgba(255,255,255,0.72); }
.work-panel.fullscreen .btn-fullscreen {
    color: rgba(255,255,255,0.88);
}
.work-panel.fullscreen .btn-fullscreen:hover:not(:disabled),
.work-panel.fullscreen .btn-fullscreen.is-exit:hover:not(:disabled) {
    background: rgba(255,255,255,0.14); color: #fff;
}
.ico-svg {
    width: 0.9rem; height: 0.9rem; display: block; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
}
.btn .ico-svg { margin: 0; }
.btn-fullscreen .ico-svg { width: 0.95rem; height: 0.95rem; }
.file-search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.35rem;
    position: relative;
}
.file-search input {
    width: 100%; min-width: 0;
    padding: 0.28em 1.7em 0.28em 0.55em;
    border: 1px solid var(--line); border-radius: 0.35rem;
    font-size: var(--fs-sm); font-family: inherit; color: var(--text);
    background: #fff; outline: none;
}
.file-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,111,237,0.15); }
.file-search input::placeholder { color: #9aa5b1; }
.file-search .clear-btn {
    position: absolute; right: 0.2rem; top: 50%; transform: translateY(-50%);
    width: 1.3rem; height: 1.3rem; padding: 0; border: none; background: transparent;
    color: var(--muted); cursor: pointer; border-radius: 0.25rem;
    display: none; align-items: center; justify-content: center;
}
.file-search .clear-btn.show { display: inline-flex; }
.file-search .clear-btn:hover { background: #eef1f4; color: var(--text); }
.file-search .clear-btn .ico-svg { width: 0.75rem; height: 0.75rem; }
.tree-node.tree-filter-hide { display: none !important; }
.tree-row.tree-filter-dim .name { opacity: 0.55; }
.empty-list.filter-empty { color: var(--muted); }
.file-list { flex: 1; overflow-y: auto; padding: 0.15rem 0; min-height: 0; }
.tree-header {
    padding: 0.35rem 0.75rem; display: grid;
    grid-template-columns: minmax(0, 1fr) 10.5rem 3rem;
    gap: 0.4rem; font-size: var(--fs-sm); color: var(--muted);
    border-bottom: 1px solid var(--line); background: #fafbfc; flex-shrink: 0;
}
.tree-node { user-select: none; }
.tree-row {
    padding: 0.35rem 0.75rem; display: grid;
    grid-template-columns: minmax(0, 1fr) 10.5rem 3rem;
    gap: 0.4rem; align-items: center; cursor: pointer;
    border-bottom: 1px solid #f3f5f7; font-size: var(--fs-sm);
}
.tree-row:hover { background: var(--accent-soft); }
.tree-row.selected { background: #dce8ff; }
.tree-row.selected.multi { background: #cfe0ff; }
.tree-row.drag-over { outline: 1px dashed var(--accent); background: #dce8ff; }
.tree-row .label {
    display: flex; align-items: center; gap: 0.25rem;
    min-width: 0; overflow: hidden;
}
.tree-row .twist {
    width: 1rem; height: 1rem; flex-shrink: 0; text-align: center;
    line-height: 1rem; color: var(--muted); font-size: 0.55rem; cursor: pointer;
    border-radius: 0.2rem;
}
.tree-row .twist:hover { background: #d7e4f8; color: var(--accent); }
.tree-row .twist.empty { visibility: hidden; pointer-events: none; }
.tree-children.collapsed { display: none !important; }
.tree-row .icon { flex-shrink: 0; width: 1rem; text-align: center; font-size: 0.75rem; }
.tree-row .name {
    font-weight: 500; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
}
.tree-row .meta { color: var(--muted); font-size: var(--fs-sm); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-row .status { font-weight: 650; font-size: var(--fs-sm); text-align: center; }
.tree-row.root-drop {
    background: #f4f7fa; border-bottom: 1px solid var(--line);
    font-size: var(--fs-sm); color: var(--muted); padding: 0.35rem 0.75rem;
}
.tree-row.root-drop .name { font-weight: 600; color: var(--text); }
.file-actions {
    padding: 0.45rem 0.75rem; border-top: 1px solid var(--line);
    display: flex; gap: 0.4rem; background: #f7f9fb;
    align-items: center; flex-shrink: 0;
}
.file-actions .hint { color: var(--muted); font-size: var(--fs-sm); margin-right: auto; }

/* 右侧：文件预览（版本操作在工具栏，不与预览并列） */
.work-panel {
    background: var(--surface); border: 1px solid var(--line);
    border-left: none; border-radius: 0 var(--radius) var(--radius) 0;
    display: flex; flex-direction: column;
    overflow: hidden; flex: 1; min-width: 0;
}
.work-panel.fullscreen {
    position: fixed; inset: 0; z-index: 1600;
    width: 100% !important; max-width: none; min-width: 0;
    border: none; border-radius: 0;
    box-shadow: none;
}
/* 预览操作：右侧紧凑工具条 */
.preview-ops {
    display: none; align-items: center; gap: 0.1rem; flex-shrink: 0;
    padding: 0.15rem 0.25rem;
    background: #eef2f6; border: 1px solid var(--line); border-radius: 0.4rem;
}
.preview-ops.show { display: inline-flex; }
.preview-ops .btn {
    padding: 0; font-size: 0.72rem; line-height: 1;
    min-height: 0; border-color: transparent; background: transparent;
}
.preview-ops .btn.ico-btn {
    width: 1.4rem; height: 1.4rem; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 0.3rem;
}
.preview-ops .btn.ico-btn:hover:not(:disabled) {
    background: #fff; border-color: transparent;
}
.preview-ops .btn.ico-btn.btn-primary {
    color: #fff; background: var(--accent); border-color: var(--accent);
}
.preview-ops .btn.ico-btn.btn-primary:hover:not(:disabled) {
    background: #245cd4; color: #fff;
}
.preview-ops .zoom-label {
    min-width: 2.5rem; text-align: center; font-size: 0.7rem;
    color: var(--muted); font-weight: 650; line-height: 1;
    font-variant-numeric: tabular-nums;
}
.preview-ops .tb-sep {
    width: 1px; height: 0.9rem; background: #cfd6dd; margin: 0 0.2rem;
}
.work-panel.fullscreen .preview-ops {
    background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18);
}
.work-panel.fullscreen .preview-ops .zoom-label { color: rgba(255,255,255,0.75); }
.work-panel.fullscreen .preview-ops .tb-sep { background: rgba(255,255,255,0.25); }
.work-panel.fullscreen .preview-ops .btn-default {
    background: transparent; color: #fff; border-color: transparent;
}
.work-panel.fullscreen .preview-ops .btn-default:hover:not(:disabled) {
    background: rgba(255,255,255,0.16);
}
.work-panel.fullscreen .preview-ops .btn-primary {
    background: rgba(255,255,255,0.92); color: var(--header); border-color: transparent;
}
.work-panel.fullscreen .preview-ops .btn-primary:hover:not(:disabled) {
    background: #fff; color: var(--header);
}
.preview-viewport {
    flex: 1; min-height: 0; overflow: hidden; background: #fafbfc;
    position: relative;
}
/* 多文件预览标签：尽量薄，把高度留给内容 */
.preview-tabs-wrap {
    display: flex; align-items: stretch; flex-shrink: 0;
    height: 1.7rem; background: #eef2f6; border-bottom: 1px solid var(--line);
}
.preview-tabs-wrap[hidden] { display: none !important; }
.preview-tabs-wrap .ptab-nav {
    flex-shrink: 0; width: 1.4rem; border: none; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 0.95rem; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; padding: 0;
}
.preview-tabs-wrap .ptab-nav:hover { background: #e2e8ef; color: var(--accent); }
.preview-tabs-wrap .ptab-nav:disabled { opacity: 0.3; cursor: default; background: transparent; }
.preview-tabs {
    display: flex; flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
}
.preview-tabs::-webkit-scrollbar { display: none; height: 0; }
.preview-tab {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 0.25rem;
    max-width: 9.5rem; height: 100%;
    padding: 0 0.2rem 0 0.55rem; border: none; border-right: 1px solid #e0e6ec;
    background: transparent; color: var(--muted); cursor: grab;
    font-size: 0.72rem; font-family: inherit; line-height: 1;
    user-select: none; -webkit-user-select: none;
}
.preview-tab:hover { background: #e4ebf2; color: var(--text); }
.preview-tab.active {
    background: #fff; color: var(--accent); font-weight: 650;
    box-shadow: inset 0 -2px 0 var(--accent);
}
.preview-tab.dragging { opacity: 0.45; cursor: grabbing; }
.preview-tab.drag-over-left { box-shadow: inset 2px 0 0 var(--accent); }
.preview-tab.drag-over-right { box-shadow: inset -2px 0 0 var(--accent); }
.preview-tab .ptab-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    pointer-events: none;
}
.preview-tab .ptab-close {
    flex-shrink: 0; width: 1.05rem; height: 1.05rem; border: none; border-radius: 0.2rem;
    background: transparent; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.85rem; line-height: 1; padding: 0;
}
.preview-tab .ptab-close:hover { background: #d8dee6; color: var(--danger); }
.preview-tab.active .ptab-close:hover { background: #eceff3; }
.work-panel.fullscreen .preview-tabs-wrap { background: #17324f; border-bottom-color: rgba(255,255,255,0.12); }
.work-panel.fullscreen .preview-tab { color: rgba(255,255,255,0.7); border-right-color: rgba(255,255,255,0.1); }
.work-panel.fullscreen .preview-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
.work-panel.fullscreen .preview-tab.active {
    background: #1e3a5f; color: #fff; box-shadow: inset 0 -2px 0 #7eb0ff;
}
.work-panel.fullscreen .preview-tab.drag-over-left { box-shadow: inset 2px 0 0 #7eb0ff; }
.work-panel.fullscreen .preview-tab.drag-over-right { box-shadow: inset -2px 0 0 #7eb0ff; }
.work-panel.fullscreen .ptab-nav { color: rgba(255,255,255,0.75); }
.work-panel.fullscreen .ptab-nav:hover { background: rgba(255,255,255,0.12); color: #fff; }
.ctx-menu button:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.preview-stage {
    transform-origin: center top;
    transition: transform 0.15s ease;
    height: 100%; min-height: 100%;
    display: flex; flex-direction: column;
}
.preview-stage.no-anim { transition: none; }
.preview-content {
    /* 多标签保活容器：各 pane 自己滚动，切走不销毁 */
    flex: 1; min-height: 0; height: 100%;
    padding: 0; position: relative;
    font-size: 0.9rem; line-height: 1.75; color: var(--text); background: #fafbfc;
    overflow: hidden;
}
.preview-pane {
    display: none;
    height: 100%;
    overflow: auto;
    padding: 1.25rem 5%;
    box-sizing: border-box;
}
.preview-pane.is-active { display: block; }
.preview-pane.is-empty {
    display: none;
    align-items: center; justify-content: center;
}
.preview-pane.is-empty.is-active { display: flex; }
.preview-pane.sheet-mode {
    padding: 0; background: #fff;
    overflow: hidden;
    flex-direction: column;
}
.preview-pane.sheet-mode.is-active { display: flex; }
.preview-pane.pdf-mode {
    padding: 0; overflow: hidden; background: #525659;
}
/* 表格：锁定可视高度，横/竖滚动条都在预览窗边缘，不用滚到底才看到横条 */
.preview-viewport.sheet-mode {
    overflow: hidden;
    display: flex; flex-direction: column;
    background: #fff;
}
.preview-viewport.sheet-mode .preview-stage {
    flex: 1; min-height: 0; height: 100%;
    display: flex; flex-direction: column;
    transform: none !important; /* 表格不用缩放，避免撑破滚动容器 */
}
.preview-content.sheet-mode {
    padding: 0; background: #fff;
    display: flex; flex-direction: column;
    flex: 1; min-height: 0; height: 100%;
}
.preview-viewport.pdf-mode { background: #525659; }
.preview-viewport.pdf-mode .preview-content { padding: 0; height: 100%; background: #525659; }
.preview-unsupported {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; padding: 8vh 5%; text-align: center; gap: 0.65rem;
}
.preview-unsupported .big-icon {
    width: 4.5rem; height: 4.5rem; border-radius: 1rem;
    background: #eef1f4; color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 2rem;
    margin-bottom: 0.35rem;
}
.preview-unsupported .fname {
    font-size: 1rem; font-weight: 650; color: var(--text);
    word-break: break-word; max-width: min(80%, 28rem);
}
.preview-unsupported .meta {
    font-size: var(--fs-sm); color: var(--muted);
}
.preview-unsupported .hint {
    font-size: 0.85rem; color: #8a96a3; max-width: min(80%, 26rem); line-height: 1.55;
    margin: 0.35rem 0 0.75rem;
}
.preview-stage .preview-image {
    display: block; margin: 1.5rem auto; max-width: 100%;
    box-shadow: 0 0.15rem 0.75rem rgba(0,0,0,0.08);
}
.preview-content h1 { font-size: 1.4rem; font-weight: 700; margin: 0.8em 0 0.4em; }
.preview-content h2 { font-size: 1.2rem; font-weight: 700; margin: 0.7em 0 0.35em; }
.preview-content h3 { font-size: 1.05rem; font-weight: 600; margin: 0.6em 0 0.35em; }
.preview-content h4, .preview-content h5, .preview-content h6 { font-size: 1rem; font-weight: 600; margin: 0.5em 0 0.25em; }
.preview-content p { margin: 0 0 0.5em; }
.preview-content ul, .preview-content ol { margin: 0.25em 0 0.5em; padding-left: 1.8em; }
.preview-content table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
.preview-content td, .preview-content th { border: 1px solid #ccc; padding: 0.4em 0.65em; font-size: 0.85rem; }
.preview-content th { background: #f0f0f0; }
.preview-content img { max-width: 100%; }
.preview-content a { color: var(--accent); }
.preview-content pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
.preview-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); font-size: 0.85rem; gap: 0.35rem; text-align: center; padding: 5%;
}
.preview-empty .flow {
    font-size: var(--fs-sm); color: #8a96a3; max-width: min(36vw, 18rem); line-height: 1.5;
}
.preview-content.pdf-mode { padding: 0; overflow: hidden; background: #525659; }
.preview-loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 40vh; color: var(--muted); gap: 0.75rem;
}
.preview-loading .spinner {
    width: 2rem; height: 2rem; border: 0.2rem solid #ddd;
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- 弹窗（vw / vh） ---- */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(20,30,40,0.35);
    display: none; align-items: center; justify-content: center; z-index: 1000;
    padding: 3vh 3vw;
}
.modal-overlay.show { display: flex; }
.modal {
    background: white; border-radius: var(--radius); padding: 1.25rem 1.4rem;
    width: min(36vw, 28rem); max-width: 94vw; max-height: 90vh;
    box-shadow: 0 0.75rem 2.5rem rgba(0,0,0,0.18);
    display: flex; flex-direction: column; min-height: 0;
}
.modal h2 { margin-bottom: 0.75rem; font-size: 1rem; flex-shrink: 0; }
.modal input, .modal textarea, .modal select {
    width: 100%; padding: 0.55em 0.75em; border: 1px solid var(--line);
    border-radius: 0.4rem; font-size: 0.85rem; margin-bottom: 0.75rem; font-family: inherit;
}
.modal textarea { height: 12vh; min-height: 4rem; resize: vertical; }
.modal .actions {
    display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem;
    flex-shrink: 0; flex-wrap: wrap;
}
.modal.modal-detail {
    width: min(42vw, 32rem);
    padding: 0;
    overflow: hidden;
}
.modal.modal-detail .detail-head {
    display: flex; align-items: flex-start; gap: 0.85rem;
    padding: 1.15rem 1.25rem 1rem;
    background: linear-gradient(180deg, #f4f7fb 0%, #fff 100%);

}
.modal.modal-detail .detail-icon {
    width: 2.75rem; height: 2.75rem; flex-shrink: 0;

    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem;
}
.modal.modal-detail .detail-icon.is-dir {
    background: #eef6ef; color: var(--ok);
}
.modal.modal-detail .detail-head-main { flex: 1; min-width: 0; }
.modal.modal-detail .detail-title {
    font-size: 1rem; font-weight: 650; line-height: 1.35;
    word-break: break-word; margin-bottom: 0.45rem;
}
.modal.modal-detail .detail-badges {
    display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
}
.modal.modal-detail .detail-badge {
    display: inline-flex; align-items: center;
    font-size: 0.7rem; font-weight: 650;
    padding: 0.15em 0.55em; border-radius: 999px;
    background: #eef1f4; color: var(--muted);
}
.modal.modal-detail .detail-badge.status-ok { background: #e6f6ec; color: var(--ok); }
.modal.modal-detail .detail-badge.status-mod { background: #fff4e0; color: var(--warn); }
.modal.modal-detail .detail-badge.status-new { background: #e8f1ff; color: #0066cc; }
.modal.modal-detail .detail-badge.status-ign { background: #f0f0f0; color: #888; }
.modal.modal-detail .detail-body { padding: 1rem 1.25rem; }
.modal.modal-detail .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem;
}
.modal.modal-detail .detail-card {
    background: #f7f9fb; border: 1px solid var(--line);
    border-radius: 0.45rem; padding: 0.65rem 0.75rem;
}
.modal.modal-detail .detail-card.span-2 { grid-column: 1 / -1; }
.modal.modal-detail .detail-card .k {
    font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; font-weight: 550;
}
.modal.modal-detail .detail-card .v {
    font-size: 0.88rem; color: var(--text); font-weight: 550;
    word-break: break-word; line-height: 1.4;
}
.modal.modal-detail .detail-card .v.path {
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.78rem; font-weight: 500;
    color: #3a4a5a; background: #fff;
    border: 1px dashed var(--line); border-radius: 0.3rem;
    padding: 0.4rem 0.5rem; display: block;
}
.modal.modal-detail .detail-foot {
    padding: 0.75rem 1.25rem 1rem;
    border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 0.5rem;
    background: #fafbfc;
}
.modal.modal-history {
    width: min(78vw, 64rem); height: min(78vh, 52rem);
    padding: 0; overflow: hidden;
}
.modal.modal-history .hist-head {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.modal.modal-history .hist-head h2 { margin: 0; }
.modal.modal-history .hist-head-main { min-width: 0; flex: 1; }
.modal.modal-history .hist-scope {
    display: none; align-items: center; gap: 0.45rem; flex-wrap: wrap;
    margin-top: 0.35rem; font-size: var(--fs-sm); color: var(--muted);
}
.modal.modal-history .hist-scope.show { display: flex; }
.modal.modal-history .hist-scope .scope-path {
    font-weight: 650; color: var(--accent);
    max-width: min(36rem, 70vw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.modal.modal-history .hist-scope .btn { padding: 0.15rem 0.55rem; font-size: 0.72rem; }
.modal.modal-history .hist-body {
    flex: 1; display: flex; min-height: 0; overflow: hidden;
}
.modal.modal-history .hist-list {
    width: 42%; min-width: 28%; max-width: 50%;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
}
.modal.modal-history .hist-list-scroll {
    flex: 1; overflow-y: auto; min-height: 0;
}
.modal.modal-history .hist-detail {
    flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: #fafbfc;
}
.modal.modal-history .hist-foot {
    padding: 0.65rem 1.2rem; border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; flex-shrink: 0;
}

.commit-summary { color: var(--muted); font-size: var(--fs-sm); margin-bottom: 0.5rem; }
.change-box {
    max-height: 28vh; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 0.4rem;
    padding: 0.65rem 0.75rem; background: #fafbfc; font-size: var(--fs-sm); margin-bottom: 0.75rem;
}
.change-box .chg-line { padding: 0.1em 0; font-family: Consolas, "Courier New", monospace; }
.commit-tip { font-size: var(--fs-sm); color: var(--muted); margin-right: auto; }

/* 历史列表行 */
.hist-row {
    display: grid;
    grid-template-columns: 3.2rem 1fr auto;
    gap: 0.5rem; align-items: center;
    padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--line);
    cursor: pointer; background: var(--surface);
}
.hist-row:hover { background: var(--accent-soft); }
.hist-row.active { background: #dce8ff; box-shadow: inset 0.2rem 0 0 var(--accent); }
.hist-row .rev {
    font-weight: 700; color: var(--accent); font-size: 0.9rem;
}
.hist-row .meta { min-width: 0; }
.hist-row .note {
    font-size: var(--fs-sm); font-weight: 550;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hist-row .time { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
.hist-row .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.3rem; }
.chip {
    display: inline-block; font-size: 0.65rem; font-weight: 650;
    padding: 0.1em 0.45em; border-radius: 0.25rem; line-height: 1.4;
}
.chip-a { background: #e8f1ff; color: #0066cc; }
.chip-m { background: #fff4e0; color: var(--warn); }
.chip-d { background: #fdecea; color: var(--danger); }
.hist-row .path-status {
    display: inline-block; margin-left: 0.35rem; padding: 0.05rem 0.35rem;
    border-radius: 0.25rem; font-size: 0.68rem; font-weight: 650;
}
.hist-row .path-status.a { background: #e8f1ff; color: #0066cc; }
.hist-row .path-status.m { background: #fff4e0; color: var(--warn); }
.hist-row .path-status.d { background: #fdecea; color: var(--danger); }
.hist-row .ops { flex-shrink: 0; }
.hist-row .ops .btn { pointer-events: auto; }

/* 历史详情面板 */
.hist-detail-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.85rem; padding: 5%; text-align: center;
}
.hist-detail-body {
    flex: 1; overflow-y: auto; padding: 1rem 1.2rem; min-height: 0;
}
.hist-detail-title {
    display: flex; align-items: baseline; gap: 0.65rem; flex-wrap: wrap;
    margin-bottom: 0.75rem;
}
.hist-detail-title .rev-big {
    font-size: 1.35rem; font-weight: 700; color: var(--accent);
}
.hist-detail-title .when { color: var(--muted); font-size: var(--fs-sm); }
.hist-detail-note {
    font-size: 0.95rem; line-height: 1.55; margin-bottom: 0.9rem;
    padding: 0.75rem 0.9rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 0.4rem;
}
.hist-detail-note.empty { color: var(--muted); font-style: italic; }
.hist-section-label {
    font-size: var(--fs-sm); font-weight: 650; color: var(--muted);
    margin: 0.85rem 0 0.45rem; display: flex; align-items: center; gap: 0.5rem;
}
.hist-section-label .chips { margin: 0; }
.hist-file-group { margin-bottom: 0.75rem; }
.hist-file-group .group-title {
    font-size: 0.72rem; font-weight: 650; margin-bottom: 0.3rem;
}
.hist-file-group .group-title.a { color: #0066cc; }
.hist-file-group .group-title.m { color: var(--warn); }
.hist-file-group .group-title.d { color: var(--danger); }
.hist-file-list {
    border: 1px solid var(--line); border-radius: 0.4rem;
    background: var(--surface); max-height: 36vh; overflow-y: auto;
}
.hist-file-list .chg-line {
    padding: 0.55rem 0.75rem; font-size: var(--fs-sm);
    border-bottom: 1px solid #f3f5f7;
    display: flex; flex-direction: column; align-items: stretch; gap: 0.4rem;
}
.hist-file-list .chg-line:last-child { border-bottom: none; }
.hist-file-list .chg-path {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: Consolas, "Courier New", monospace;
}
.hist-file-list .chg-acts {
    display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center;
}
.hist-file-list .chg-acts .btn { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
.hist-file-card {
    border: 1px solid var(--line); border-radius: 0.45rem;
    background: var(--surface); padding: 0.85rem 1rem; margin: 0.35rem 0 0.75rem;
}
.hist-file-card .fname {
    font-size: 0.9rem; font-weight: 650; color: var(--text);
    word-break: break-all; margin-bottom: 0.65rem;
}
.hist-file-card .acts {
    display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
}
.hist-file-card .acts .btn { font-size: 0.78rem; }
.hist-act-hint {
    margin-top: 0.65rem; font-size: 0.72rem; color: var(--muted); line-height: 1.45;
}

/* 内容对比弹窗 */
.modal.modal-diff {
    width: min(82vw, 56rem); height: min(82vh, 48rem); padding: 0; overflow: hidden;
}
.modal.modal-diff .diff-head {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.modal.modal-diff .diff-head h2 { margin: 0; font-size: 0.95rem; }
.modal.modal-diff .diff-meta {
    padding: 0.55rem 1.1rem; font-size: var(--fs-sm); color: var(--muted);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
    display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
}
.modal.modal-diff .diff-body {
    flex: 1; overflow: auto; min-height: 0; background: #1e1e1e; color: #d4d4d4;
    font-family: Consolas, "Courier New", monospace; font-size: 0.78rem; line-height: 1.45;
    padding: 0.75rem 0;
}

    padding: 0.55rem 1.1rem; border-top: 1px solid var(--line);

}
.diff-line { padding: 0 1rem; white-space: pre-wrap; word-break: break-all; }

.diff-empty {
    color: var(--muted); text-align: center; padding: 12vh 5%;
    background: #fafbfc; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
}
.hist-detail-actions {
    display: flex; gap: 0.5rem; flex-wrap: wrap;
    margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid var(--line);
}
.chg-a { color: #0066cc; }
.chg-m { color: var(--warn); }
.chg-d { color: var(--danger); }
.change-empty { color: var(--muted); text-align: center; padding: 8vh 5%; }

.status-bar {
    /* legacy alias kept if referenced; real footer is .footer-bar */
    display: none;
}
.empty-list { padding: 8vh 5%; text-align: center; color: var(--muted); font-size: 0.85rem; }
.ctx-menu {
    position: fixed; background: white; border: 1px solid var(--line);
    border-radius: 0.4rem; box-shadow: 0 0.4rem 1.25rem rgba(0,0,0,0.12);
    z-index: 2500; min-width: 10rem; padding: 0.25rem 0; display: none;
}
.ctx-menu.show { display: block; }
.ctx-menu button {
    display: block; width: 100%; text-align: left;
    padding: 0.55rem 0.9rem; border: none; background: none;
    font-size: var(--fs-sm); cursor: pointer; font-family: inherit;
}

.ctx-menu .sep { height: 1px; background: var(--line); margin: 0.25rem 0; }
.toast {
    position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
    background: #2c3a47; color: white; padding: 0.65rem 1.25rem;
    border-radius: 0.4rem; font-size: var(--fs-sm); z-index: 2000;
    opacity: 0; transition: opacity 0.3s; max-width: 80vw;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--ok); }
.toast.error { background: var(--danger); }
.global-loading {
    position: fixed; inset: 0; background: rgba(255,255,255,0.5);
    display: none; align-items: center; justify-content: center; z-index: 3000;
    flex-direction: column; gap: 0.75rem;
}
.global-loading.show { display: flex; }
.global-loading .spinner {
    width: 2.25rem; height: 2.25rem; border: 0.2rem solid #ddd;
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
.global-loading .msg {
    font-size: 0.85rem; color: #555; background: rgba(255,255,255,0.95);
    padding: 0.4rem 0.9rem; border-radius: 1rem;
    box-shadow: 0 0.15rem 0.6rem rgba(0,0,0,0.06);
}
.preview-content code {
    background: #f0f0f0; padding: 0.15em 0.4em; border-radius: 0.25rem;
    font-family: Consolas, "Courier New", monospace; font-size: 0.85em; color: #c7254e;
}
.preview-content pre {
    background: #f6f8fa; padding: 0.75rem 1rem; border-radius: 0.4rem;
    border: 1px solid #e1e4e8; overflow-x: auto; margin: 0.5em 0;
}
.preview-content pre code { background: none; padding: 0; color: #333; display: block; white-space: pre; }
.preview-content blockquote {
    border-left: 0.2rem solid var(--accent); padding: 0.25em 0.9em;
    margin: 0.5em 0; color: #666; background: #f9f9f9;
}
.preview-content .docx-wrapper {
    background: #e8e8e8; padding: 1rem; min-height: 100%;
}
.preview-content .docx-wrapper > .docx {
    margin: 0 auto 1rem; box-shadow: 0 0.15rem 0.5rem rgba(0,0,0,0.12); background: white;
}
.sheet-viewer {
    display: flex; flex-direction: column; gap: 0;
    flex: 1; min-height: 0; height: 100%; width: 100%;
}
.sheet-tabs-wrap {
    display: flex; align-items: stretch; gap: 0; flex-shrink: 0;
    border-bottom: 1px solid var(--line); background: #f7f9fb;
}
.sheet-tabs-wrap .sheet-nav {
    flex-shrink: 0; width: 1.65rem; border: none; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: inherit; padding: 0;
}
.sheet-tabs-wrap .sheet-nav:hover { background: #e8edf2; color: var(--accent); }
.sheet-tabs-wrap .sheet-nav:disabled {
    opacity: 0.35; cursor: default; background: transparent;
}
.sheet-viewer .sheet-tabs {
    display: flex; gap: 0; flex: 1; min-width: 0;
    overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap;
    scrollbar-width: none; -ms-overflow-style: none;
}
.sheet-viewer .sheet-tabs::-webkit-scrollbar { display: none; height: 0; }
.sheet-viewer .sheet-tab {
    border: none; border-right: 1px solid #e8edf2; background: transparent;
    color: var(--muted); font-size: 0.75rem; font-family: inherit;
    padding: 0.4em 0.75em; cursor: pointer; flex-shrink: 0;
    white-space: nowrap; max-width: 10rem;
    overflow: hidden; text-overflow: ellipsis;
}
.sheet-viewer .sheet-tab:hover { background: #eef1f4; color: var(--text); }
.sheet-viewer .sheet-tab.active {
    background: #fff; color: var(--accent); font-weight: 650;
    box-shadow: inset 0 -2px 0 var(--accent);
}
.sheet-viewer .sheet-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
}
.sheet-viewer .sheet-scroll {
    overflow: auto; flex: 1; min-height: 0; width: 100%;
    background: #fff; border: none; border-radius: 0;
    /* 保证无论内容多高，横条始终在可视区底部 */
    overscroll-behavior: contain;
}
.sheet-viewer .sheet-table {
    border-collapse: collapse; width: max-content; min-width: 100%; margin: 0;
    font-size: 0.72rem; line-height: 1.25;
}
.sheet-viewer .sheet-table th,
.sheet-viewer .sheet-table td {
    border: 1px solid #e4e9ef; padding: 0.12em 0.4em;
    white-space: nowrap; max-width: 14rem;
    overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
}
.sheet-viewer .sheet-table th {
    background: #eef2f6; font-weight: 650; position: sticky; top: 0; z-index: 1;
}
.sheet-viewer .sheet-table tbody tr:nth-child(even) td { background: #fafbfc; }
.sheet-viewer .sheet-table tbody tr:hover td { background: #eef5ff; }
.sheet-viewer .sheet-empty { color: var(--muted); padding: 1.5rem; text-align: center; font-size: 0.85rem; }
.sheet-viewer .sheet-meta {
    font-size: 0.72rem; color: var(--warn); margin: 0; padding: 0.25rem 0.5rem;
    background: #fff8e8; border-bottom: 1px solid #f0e0b8;
}
@media (max-width: 720px) {
    .modal.modal-history { width: 94vw; height: 88vh; }

<script>
let selectedMap = {};
let lastClickedPath = null;
let expandedDirs = {};
let nameModalMode = null;
let nameModalBase = '';
let dragSrcPath = null;
let uploadTargetDir = '';
let loadingCount = 0;
let workspaceReady = false;
let pendingDirtyCount = 0;
let lastPending = null;
let historyCache = [];
let selectedHistoryVer = null;
/** 路径历史范围：空字符串=全部修订 */
let historyScopePath = '';
let historyScopeIsDir = false;

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}

function selectedPaths() {
    return Object.keys(selectedMap);
}

function primarySelection() {
    const paths = selectedPaths();
    if (!paths.length) return { path: null, type: null };
    const p = (lastClickedPath != null && selectedMap[lastClickedPath] != null)
        ? lastClickedPath : paths[paths.length - 1];
    return { path: p, type: selectedMap[p] };
}

function showLoading(msg) {
    loadingCount++;
    const el = document.getElementById('globalLoading');
    document.getElementById('globalLoadingMsg').textContent = msg || '处理中...';
    el.classList.add('show');
    document.getElementById('statusBar').textContent = msg || '处理中...';
}

function hideLoading() {
    loadingCount = Math.max(0, loadingCount - 1);
    if (loadingCount === 0) {
        document.getElementById('globalLoading').classList.remove('show');
    }
}

function api(path, method, body, cb, errCb) {
    fetch('/api/' + path, {
        method: method,
        headers: method === 'POST' ? {'Content-Type':'application/json'} : {},
        body: method === 'POST' ? JSON.stringify(body) : null
    })
    .then(r => r.json())
    .then(d => cb(d))
    .catch(e => {
        console.error(e);
        if (errCb) errCb(e);
        else showToast('请求失败: ' + e, 'error');
    });
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    setTimeout(() => t.className = 'toast', 3000);
    document.getElementById('statusBar').textContent = msg;
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function setPathLink(el, path, target) {
    if (!path) {
        el.textContent = '—';
        el.classList.add('empty');
        el.onclick = null;
        return;
    }
    // 底部栏只显示末级目录名，完整路径放 title
    const norm = String(path).replace(/\\/g, '/');
    const parts = norm.split('/').filter(Boolean);
    const short = parts.length ? parts[parts.length - 1] : norm;
    el.textContent = short;
    el.title = '点击打开: ' + path;
    el.classList.remove('empty');
    el.onclick = function(e) {
        e.preventDefault();
        openExplorer(target);
    };
}

function setStatusMsg(msg) {
    const el = document.getElementById('statusBar');
    if (el) el.textContent = msg || '';
    if (el) el.title = msg || '';
}

function openExplorer(target, rel) {
    showLoading('正在打开资源管理器...');
    api('open_explorer', 'POST', {target: target, path: rel || ''}, d => {
        hideLoading();
        if (!d.ok) showToast(d.msg, 'error');
        else document.getElementById('statusBar').textContent = d.msg;
    }, () => { hideLoading(); showToast('打开失败', 'error'); });
}

function refresh() {
    showLoading('正在刷新...');
    api('workspace', 'GET', null, d => {
        if (!d.selected) {
            workspaceReady = false;
            window.currentDir = null;
            window.backupDir = null;
            setPathLink(document.getElementById('workDirLink'), null, 'work');
            setPathLink(document.getElementById('backupDirLink'), null, 'backup');
            setPathLink(document.getElementById('ignoreLink'), null, 'ignore');
            document.getElementById('statsInfo').textContent = '';
            document.getElementById('fileList').innerHTML = '<div class="empty-list">工作区未就绪</div>';
            previewTabs = [];
            previewActivePath = '';
            clearAllPreviewPanes();
            renderPreviewTabBar();
            showPreviewEmptyState();
            applyPendingToToolbar(null);
            hideLoading();
            return;
        }
        workspaceReady = true;
        window.currentDir = d.workspace_dir || d.dir;
        window.backupDir = d.backup_dir;
        setPathLink(document.getElementById('workDirLink'), d.workspace_dir || d.dir, 'work');
        setPathLink(document.getElementById('backupDirLink'), d.backup_dir, 'backup');
        setPathLink(document.getElementById('ignoreLink'), d.ignore_file || 'ignore.txt', 'ignore');
        const head = d.head_revision != null ? d.head_revision : 0;
        document.getElementById('headBadge').textContent = 'HEAD r' + head;
        document.getElementById('statsInfo').textContent =
            '跟踪 ' + d.total + ' · 正常 ' + d.committed + ' · 修改 ' + d.modified + ' · 新增 ' + d.new;
        loadFiles(() => {
            hideLoading();
            document.getElementById('statusBar').textContent = '就绪';
            reloadPreviewIfNeeded();
            refreshVersionToolbar();
        });
    }, () => { hideLoading(); showToast('刷新失败', 'error'); });
}

function reloadPreviewIfNeeded() {
    prunePreviewTabs(collectExistingFilePaths());
    if (previewActivePath) {
        previewFile(previewActivePath);
    }
}

function collectExistingFilePaths() {
    const paths = [];
    document.querySelectorAll('#fileList .tree-row[data-type="file"]').forEach(function(el) {
        if (el.dataset.path) paths.push(el.dataset.path);
    });
    return paths;
}

/** 静默刷新：只更新状态栏/树状态，绝不重载预览（避免闪烁） */
let quietBusy = false;
let lastQuietAt = 0;

function refreshQuiet() {
    if (!workspaceReady || loadingCount > 0 || quietBusy) return;
    const now = Date.now();
    if (now - lastQuietAt < 2500) return; // 防抖：focus + visibility 常连发
    lastQuietAt = now;
    quietBusy = true;

    api('workspace', 'GET', null, d => {
        if (!d.selected) { quietBusy = false; return; }
        const head = d.head_revision != null ? d.head_revision : 0;
        document.getElementById('headBadge').textContent = 'HEAD r' + head;
        document.getElementById('statsInfo').textContent =
            '跟踪 ' + d.total + ' · 正常 ' + d.committed + ' · 修改 ' + d.modified + ' · 新增 ' + d.new;
        refreshVersionToolbar();
        api('files', 'GET', null, tree => {
            patchTreeStatuses(tree || []);
            quietBusy = false;
        }, () => { quietBusy = false; });
    }, () => { quietBusy = false; });
}

function walkTreeNodes(nodes, fn) {
    (nodes || []).forEach(n => {
        fn(n);
        if (n.type === 'dir' && n.children) walkTreeNodes(n.children, fn);
    });
}

/** 就地更新文件状态/大小，不重建 DOM、不丢选中与展开 */
function patchTreeStatuses(tree) {
    const byPath = {};
    walkTreeNodes(tree, n => { byPath[n.path] = n; });
    const rows = document.querySelectorAll('#fileList .tree-row');
    let structureChanged = false;
    const seen = {};
    rows.forEach(row => {
        const p = row.dataset.path;
        seen[p] = true;
        const n = byPath[p];
        if (!n) {
            structureChanged = true;
            return;
        }
        if (row.dataset.type !== n.type) {
            structureChanged = true;
            return;
        }
        if (n.type === 'file') {
            const meta = row.querySelector('.meta');
            const st = row.querySelector('.status');
            if (meta) {
                meta.textContent = n.time || '';
                meta.title = n.time || '';
            }
            if (st) {
                st.textContent = n.status || '';
                st.style.color = n.color || '#888';
            }
            row.dataset.name = n.name || '';
            row.dataset.size = n.size || '';
            row.dataset.time = n.time || '';
            row.dataset.status = n.status || '';
        }
    });
    walkTreeNodes(tree, n => {
        if (!seen[n.path]) structureChanged = true;
    });
    // 有增删/移动时才整树重建（仍不重载预览）
    if (structureChanged) {
        const list = document.getElementById('fileList');
        if (!tree || tree.length === 0) {
            list.innerHTML = '<div class="empty-list">暂无文件，请上传到根目录或新建文件夹</div>';
        } else {
            list.innerHTML = renderTree(tree, 0);
            bindTreeEvents(list);
            applyFileFilter();
        }
        Object.keys(selectedMap).forEach(p => {
            if (p === '') return;
            const found = Array.from(document.querySelectorAll('.tree-row')).some(el => el.dataset.path === p);
            if (!found) delete selectedMap[p];
        });
        applySelectionHighlight();
        prunePreviewTabs(collectExistingFilePaths());
    }
}

function applyPendingToToolbar(d) {
    const btn = document.getElementById('toolbarCommitBtn');
    const sum = document.getElementById('pendingToolbarSummary');
    const badge = document.getElementById('commitStatusBadge');
    const badgeText = document.getElementById('commitStatusText');
    if (!btn || !sum) return;

    function setCleanBadge() {
        if (badge) {
            badge.className = 'commit-status is-clean';
            badge.style.cursor = 'default';
            badge.onclick = null;
        }
        if (badgeText) badgeText.textContent = '已同步';
    }

    if (!d || !d.ok) {
        btn.disabled = true;
        sum.className = 'pending-summary';
        sum.textContent = '无法检测变更';
        if (badge) {
            badge.className = 'commit-status is-unknown';
            badge.style.cursor = 'default';
            badge.onclick = null;
        }
        if (badgeText) badgeText.textContent = '状态未知';
        return;
    }
    lastPending = d;
    const nA = (d.added || []).length;
    const nM = (d.modified || []).length;
    const nD = (d.deleted || []).length;
    const n = nA + nM + nD;
    pendingDirtyCount = n;
    if (!d.has_changes || n === 0) {
        btn.disabled = true;
        sum.className = 'pending-summary clean';
        sum.textContent = '无可提交变更';
        sum.title = '与 HEAD 一致';
        setCleanBadge();
        return;
    }
    btn.disabled = false;
    const parts = [];
    if (nA) parts.push('新增' + nA);
    if (nM) parts.push('修改' + nM);
    if (nD) parts.push('删除' + nD);
    const prefix = d.is_first ? '首次提交 · ' : '相对 r' + (d.head_revision || 0) + ' · ';
    sum.className = 'pending-summary has-changes';
    sum.textContent = prefix + parts.join(' · ');
    sum.title = '共 ' + n + ' 项待提交（跟踪 ' + (d.total_files || 0) + ' 个文件）';
    if (badge) {
        badge.className = 'commit-status is-dirty';
        badge.style.cursor = 'pointer';
        badge.onclick = function() { if (!btn.disabled) showCommitModal(); };
    }
    if (badgeText) badgeText.textContent = '有未提交变更';
}

function refreshVersionToolbar() {
    api('pending_changes', 'GET', null, applyPendingToToolbar);
}

function getMkdirParent() {
    const sel = primarySelection();
    if (sel.type === 'dir' && sel.path != null) return sel.path;
    if (sel.type === 'file' && sel.path) {
        const i = sel.path.lastIndexOf('/');
        return i >= 0 ? sel.path.slice(0, i) : '';
    }
    return '';
}

function updateSelHint() {
    const hint = document.getElementById('selHint');
    const paths = selectedPaths();
    if (!paths.length) {
        hint.textContent = '选文件预览 · 有改动后点工具栏「提交」· Ctrl/Shift 多选';
        return;
    }
    if (paths.length > 1) {
        hint.textContent = '已选 ' + paths.length + ' 项（可删除 / 移动）';
        return;
    }

    if (sel.type === 'dir') {

    } else {
        hint.textContent = '已选: ' + sel.path;
    }
}

function applySelectionHighlight() {
    const multi = selectedPaths().length > 1;
    document.querySelectorAll('.tree-row').forEach(el => {
        const on = Object.prototype.hasOwnProperty.call(selectedMap, el.dataset.path);
        el.classList.toggle('selected', on);
        el.classList.toggle('multi', on && multi);
    });
    updateSelHint();
}

function clearSelection() {
    selectedMap = {};
    lastClickedPath = null;
    applySelectionHighlight();
}

function setSingleSelection(path, type) {
    selectedMap = {};
    selectedMap[path] = type;
    lastClickedPath = path;
    applySelectionHighlight();
}

function toggleSelection(path, type) {
    if (Object.prototype.hasOwnProperty.call(selectedMap, path)) {
        delete selectedMap[path];
        if (lastClickedPath === path) lastClickedPath = selectedPaths()[0] || null;
    } else {
        selectedMap[path] = type;
        lastClickedPath = path;
    }
    applySelectionHighlight();
}

function getVisibleRows() {
    const rows = [];
    const root = document.getElementById('rootDrop');
    if (root) rows.push(root);
    document.querySelectorAll('#fileList .tree-row').forEach(r => {
        // skip if inside collapsed / filtered-out ancestor
        let hide = false;
        let p = r.parentElement;
        while (p && p.id !== 'fileList') {
            if (p.classList && p.classList.contains('tree-children') && p.classList.contains('collapsed')) {
                hide = true; break;
            }
            if (p.classList && p.classList.contains('tree-node') && p.classList.contains('tree-filter-hide')) {
                hide = true; break;
            }
            p = p.parentElement;
        }
        if (!hide) rows.push(r);
    });
    return rows;
}

function selectRange(toPath, toType) {
    const rows = getVisibleRows();
    let fromIdx = -1, toIdx = -1;
    rows.forEach((r, i) => {
        if (r.dataset.path === lastClickedPath) fromIdx = i;
        if (r.dataset.path === toPath) toIdx = i;
    });
    if (fromIdx < 0) {
        setSingleSelection(toPath, toType);
        return;
    }
    if (toIdx < 0) toIdx = fromIdx;
    const a = Math.min(fromIdx, toIdx), b = Math.max(fromIdx, toIdx);
    selectedMap = {};
    for (let i = a; i <= b; i++) {
        selectedMap[rows[i].dataset.path] = rows[i].dataset.type;
    }
    lastClickedPath = toPath;
    applySelectionHighlight();
}

function loadFiles(done) {
    api('files', 'GET', null, tree => {
        const list = document.getElementById('fileList');
        if (!tree || tree.length === 0) {
            list.innerHTML = '<div class="empty-list">暂无文件，请上传到根目录或新建文件夹</div>';
        } else {
            list.innerHTML = renderTree(tree, 0);
            bindTreeEvents(list);
            applyFileFilter();
        }
        // drop invalid selections
        Object.keys(selectedMap).forEach(p => {
            if (p === '') return;
            const exists = list.querySelector('.tree-row[data-path]') &&
                Array.from(list.querySelectorAll('.tree-row')).some(el => el.dataset.path === p);
            if (!exists && p !== '') {
                // keep root selection; for others check
                const found = Array.from(document.querySelectorAll('.tree-row')).some(el => el.dataset.path === p);
                if (!found) delete selectedMap[p];
            }
        });
        applySelectionHighlight();
        prunePreviewTabs(collectExistingFilePaths());
        if (done) done();
    }, () => { if (done) done(); showToast('加载文件列表失败', 'error'); });
}

function renderTree(nodes, depth) {
    let html = '';
    (nodes || []).forEach(n => {
        const isDir = n.type === 'dir';
        const pad = 0.35 + depth * 0.85;
        if (isDir && expandedDirs[n.path] === undefined) expandedDirs[n.path] = true;
        const expanded = isDir ? !!expandedDirs[n.path] : false;
        const twist = isDir ? (expanded ? '▼' : '▶') : '';
        const icon = isDir ? '📁' : '📄';
        html += '<div class="tree-node" data-path="' + esc(n.path) + '" data-type="' + n.type + '">';
        html += '<div class="tree-row" draggable="true" data-path="' + esc(n.path) + '" data-type="' + n.type + '"' +
            ' data-name="' + esc(n.name || '') + '"' +
            ' data-size="' + esc(n.size || '') + '"' +
            ' data-time="' + esc(n.time || '') + '"' +
            ' data-status="' + esc(n.status || '') + '"' +
            ' style="padding-left:' + pad + 'rem">';
        html += '<div class="label"><span class="twist' + (isDir ? '' : ' empty') + '">' + twist + '</span><span class="icon">' + icon + '</span>';
        html += '<span class="name" title="' + esc(n.path) + '">' + esc(n.name) + '</span></div>';
        if (isDir) {
            html += '<div class="meta"></div><div class="status"></div>';
        } else {
            html += '<div class="meta" title="' + esc(n.time || '') + '">' + esc(n.time || '') + '</div>';
            html += '<div class="status" style="color:' + esc(n.color || '#888') + '">' + esc(n.status || '') + '</div>';
        }
        html += '</div>';
        if (isDir) {
            html += '<div class="tree-children' + (expanded ? '' : ' collapsed') + '">';
            html += renderTree(n.children || [], depth + 1);
            html += '</div>';
        }
        html += '</div>';
    });
    return html;
}

function bindTreeEvents(list) {
    list.querySelectorAll('.tree-row').forEach(row => {
        row.addEventListener('click', function(e) {
            e.stopPropagation();
            const path = this.dataset.path;
            const type = this.dataset.type;
            const twistEl = e.target.closest ? e.target.closest('.twist') : null;
            if (twistEl && !twistEl.classList.contains('empty') && type === 'dir') {
                toggleDir(path, this);
                return;
            }
            handleRowClick(path, type, e);
        });
        row.addEventListener('dblclick', function(e) {
            e.stopPropagation();
            if (this.dataset.type === 'dir') toggleDir(this.dataset.path, this);
            else openExplorer('item', this.dataset.path);
        });
        row.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const path = this.dataset.path;
            const type = this.dataset.type;
            if (!Object.prototype.hasOwnProperty.call(selectedMap, path)) {
                setSingleSelection(path, type);
            }
            lastClickedPath = path;
            showCtxMenu(e.clientX, e.clientY);
        });
        row.addEventListener('dragstart', function(e) {
            const path = this.dataset.path;
            if (!Object.prototype.hasOwnProperty.call(selectedMap, path)) {
                setSingleSelection(path, this.dataset.type);
            }
            dragSrcPath = path;
            e.dataTransfer.setData('text/plain', path);
            e.dataTransfer.effectAllowed = 'move';
        });
        row.addEventListener('dragend', function() {
            dragSrcPath = null;
            list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });
        if (row.dataset.type === 'dir') {
            row.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                this.classList.add('drag-over');
            });
            row.addEventListener('dragleave', function() {
                this.classList.remove('drag-over');
            });
            row.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                const dest = this.dataset.path;
                const srcs = selectedPaths().filter(p => p !== '' && p !== dest);
                if (!srcs.length) {
                    const src = e.dataTransfer.getData('text/plain') || dragSrcPath;
                    if (src && src !== dest) doMovePaths([src], dest);
                } else {
                    doMovePaths(srcs, dest);
                }
            });
        }
    });
    list.addEventListener('dragover', function(e) {
        if (e.target === list) { e.preventDefault(); }
    });
    list.addEventListener('drop', function(e) {
        if (e.target !== list) return;
        e.preventDefault();
        const srcs = selectedPaths().filter(p => p !== '');
        if (srcs.length) doMovePaths(srcs, '');
        else {
            const src = e.dataTransfer.getData('text/plain') || dragSrcPath;
            if (src) doMovePaths([src], '');
        }
    });
}

function handleRowClick(path, type, e) {
    if (e.shiftKey && lastClickedPath != null) {
        selectRange(path, type);
    } else if (e.ctrlKey || e.metaKey) {
        toggleSelection(path, type);
    } else {
        setSingleSelection(path, type);
        if (type === 'file') {
            openPreviewTab(path);
        }
        // 选中文件夹时不打断已打开的预览标签
    }
    hideCtxMenu();
}

function getTreeChildren(node) {
    if (!node) return null;
    for (let i = 0; i < node.children.length; i++) {
        const c = node.children[i];
        if (c.classList && c.classList.contains('tree-children')) return c;
    }
    return null;
}

function toggleDir(path, rowEl) {
    expandedDirs[path] = !expandedDirs[path];
    applyDirExpandState(path, rowEl, !!expandedDirs[path]);
}

function applyDirExpandState(path, rowEl, expanded) {
    const node = rowEl ? rowEl.closest('.tree-node') : null;
    const kids = getTreeChildren(node);
    const twist = rowEl ? rowEl.querySelector('.twist') : null;
    if (kids) {
        if (expanded) kids.classList.remove('collapsed');
        else kids.classList.add('collapsed');
    }
    if (twist && !twist.classList.contains('empty')) {
        twist.textContent = expanded ? '▼' : '▶';
    }
}

function setAllDirsExpanded(expanded) {
    const list = document.getElementById('fileList');
    list.querySelectorAll('.tree-node[data-type="dir"]').forEach(node => {
        const path = node.dataset.path;
        expandedDirs[path] = expanded;
        for (let i = 0; i < node.children.length; i++) {
            if (node.children[i].classList && node.children[i].classList.contains('tree-row')) {
                applyDirExpandState(path, node.children[i], expanded);
                break;
            }
        }
    });
}

function expandAllDirs() { setAllDirsExpanded(true); }
function collapseAllDirs() { setAllDirsExpanded(false); }

function getFileSearchQuery() {
    const input = document.getElementById('fileSearchInput');
    return input ? String(input.value || '').trim().toLowerCase() : '';
}

function applyFileFilter() {
    const list = document.getElementById('fileList');
    const clearBtn = document.getElementById('fileSearchClear');
    const q = getFileSearchQuery();
    if (clearBtn) clearBtn.classList.toggle('show', !!q);
    if (!list) return;

    const oldEmpty = list.querySelector('.empty-list.filter-empty');
    if (oldEmpty) oldEmpty.remove();

    const nodes = list.querySelectorAll('.tree-node');
    if (!q) {
        nodes.forEach(n => {
            n.classList.remove('tree-filter-hide');
            const row = n.querySelector(':scope > .tree-row');
            if (row) row.classList.remove('tree-filter-dim');
        });
        return;
    }

    const matched = new Set();
    nodes.forEach(node => {
        const row = node.querySelector(':scope > .tree-row');
        if (!row) return;
        const name = (row.dataset.name || '').toLowerCase();
        const path = (row.dataset.path || '').toLowerCase();
        if (name.includes(q) || path.includes(q)) matched.add(node);
    });

    const keep = new Set(matched);
    matched.forEach(node => {
        let p = node.parentElement;
        while (p && p !== list) {
            if (p.classList && p.classList.contains('tree-node')) keep.add(p);
            p = p.parentElement;
        }
    });

    nodes.forEach(node => {
        const show = keep.has(node);
        node.classList.toggle('tree-filter-hide', !show);
        const row = node.querySelector(':scope > .tree-row');
        if (row) row.classList.toggle('tree-filter-dim', show && !matched.has(node));
        if (show && node.dataset.type === 'dir') {
            const kids = getTreeChildren(node);
            if (kids) kids.classList.remove('collapsed');
            const twist = row && row.querySelector('.twist');
            if (twist && !twist.classList.contains('empty')) twist.textContent = '▼';
        }
    });

    if (keep.size === 0 && !list.querySelector('.empty-list')) {
        const tip = document.createElement('div');
        tip.className = 'empty-list filter-empty';
        tip.textContent = '无匹配「' + q + '」的文件';
        list.appendChild(tip);
    }
}

function clearFileSearch() {
    const input = document.getElementById('fileSearchInput');
    if (input) {
        input.value = '';
        input.focus();
    }
    applyFileFilter();
}

(function initFileSearch() {
    const input = document.getElementById('fileSearchInput');
    const clearBtn = document.getElementById('fileSearchClear');
    if (!input) return;
    let timer = null;
    input.addEventListener('input', function() {
        clearTimeout(timer);
        timer = setTimeout(applyFileFilter, 120);
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            e.preventDefault();
            clearFileSearch();
        }
    });
    if (clearBtn) clearBtn.addEventListener('click', clearFileSearch);
})();

function icoSvg(paths) {

}
const ICO_MAXIMIZE = '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
const ICO_MINIMIZE = '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>';

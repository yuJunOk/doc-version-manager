function uploadFiles(input) {
    const files = input.files;
    if (!files || files.length === 0) return;
    if (!workspaceReady) { showToast('工作区未就绪', 'error'); input.value = ''; return; }
    let done = 0;
    let failed = 0;
    const destDir = uploadTargetDir || '';
    showLoading('正在上传 0/' + files.length + '...');
    for (const f of files) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const b64 = e.target.result.split(',')[1];
            api('upload', 'POST', {name: f.name, data: b64, dir: destDir}, d => {
                done++;
                if (!d.ok) failed++;
                document.getElementById('globalLoadingMsg').textContent =
                    '正在上传 ' + done + '/' + files.length + '...';
                if (done === files.length) {
                    hideLoading();
                    input.value = '';
                    uploadTargetDir = '';
                    if (destDir) expandedDirs[destDir] = true;
                    refresh();
                    if (failed) showToast('上传完成，失败 ' + failed + ' 个', 'error');
                    else showToast('已上传 ' + files.length + ' 个文件' + (destDir ? ('到 /' + destDir) : '到根目录'), 'success');
                }
            }, () => {
                done++;
                failed++;
                document.getElementById('globalLoadingMsg').textContent =
                    '正在上传 ' + done + '/' + files.length + '...';
                if (done === files.length) {
                    hideLoading();
                    input.value = '';
                    uploadTargetDir = '';
                    refresh();
                    showToast('上传完成，失败 ' + failed + ' 个', 'error');
                }
            });
        };
        reader.onerror = function() {
            done++;
            failed++;
            if (done === files.length) {
                hideLoading();
                input.value = '';
                refresh();
                showToast('上传完成，失败 ' + failed + ' 个', 'error');
            }
        };
        reader.readAsDataURL(f);
    }
}

function renderChangeLines(changes) {
    if (!changes) return '<div class="change-empty">无变更明细</div>';
    let html = '';
    (changes.added || []).forEach(p => {
        html += '<div class="chg-line chg-a">+ A  ' + esc(p) + '</div>';
    });
    (changes.modified || []).forEach(p => {
        html += '<div class="chg-line chg-m">~ M  ' + esc(p) + '</div>';
    });
    (changes.deleted || []).forEach(p => {
        html += '<div class="chg-line chg-d">- D  ' + esc(p) + '</div>';
    });
    if (!html) html = '<div class="change-empty">无文件变更</div>';
    return html;
}

function changeChipsHtml(changes) {
    if (!changes) return '';
    const nA = (changes.added || []).length;
    const nM = (changes.modified || []).length;
    const nD = (changes.deleted || []).length;
    let html = '';
    if (nA) html += '<span class="chip chip-a">+' + nA + '</span>';
    if (nM) html += '<span class="chip chip-m">~' + nM + '</span>';
    if (nD) html += '<span class="chip chip-d">-' + nD + '</span>';
    if (!html) html = '<span class="chip" style="background:#eee;color:#888">无变更</span>';
    return html;
}

function renderGroupedChanges(changes, revNum) {
    if (!changes) return '<div class="change-empty">无变更明细</div>';
    const groups = [
        { key: 'added', label: '新增', cls: 'a', mark: '+ A' },
        { key: 'modified', label: '修改', cls: 'm', mark: '~ M' },
        { key: 'deleted', label: '删除', cls: 'd', mark: '- D' },
    ];
    let html = '';
    let any = false;
    const rev = Number(revNum);
    const prev = findPrevRev(rev);
    groups.forEach(g => {
        const list = changes[g.key] || [];
        if (!list.length) return;
        any = true;
        html += '<div class="hist-file-group">';
        html += '<div class="group-title ' + g.cls + '">' + g.label + '（' + list.length + '）</div>';
        html += '<div class="hist-file-list">';
        list.forEach(p => {
            const ep = esc(p);
            let acts = '';
            if (g.key === 'modified') {
                // 修改：主按钮「修改前」，次按钮「修改后」
                if (prev != null) {
                    acts += '<button type="button" class="btn btn-sm btn-primary" data-act="dl" data-path="' + ep +
                        '" data-rev="' + prev + '" data-kind="at" title="下载修改前（修订 r' + prev + '）">修改前</button>';
                }
                acts += '<button type="button" class="btn btn-sm btn-default" data-act="dl" data-path="' + ep +
                    '" data-rev="' + rev + '" data-kind="at" title="下载修改后（修订 r' + rev + '）">修改后</button>';
                acts += '<button type="button" class="btn btn-sm btn-default" data-act="diff" data-path="' + ep +
                    '" data-rev="' + rev + '" data-kind="modified">对比</button>';
            } else if (g.key === 'deleted') {
                if (prev != null) {
                    acts += '<button type="button" class="btn btn-sm btn-primary" data-act="dl" data-path="' + ep +
                        '" data-rev="' + prev + '" data-kind="at" title="下载删除前的内容（r' + prev + '）">下载</button>';
                }
                acts += '<button type="button" class="btn btn-sm btn-default" data-act="diff" data-path="' + ep +
                    '" data-rev="' + rev + '" data-kind="deleted">对比</button>';
            } else {
                // added
                acts += '<button type="button" class="btn btn-sm btn-default" data-act="dl" data-path="' + ep +
                    '" data-rev="' + rev + '" data-kind="at" title="下载本修订新增的文件（r' + rev + '）">下载</button>';
                acts += '<button type="button" class="btn btn-sm btn-default" data-act="diff" data-path="' + ep +
                    '" data-rev="' + rev + '" data-kind="added">对比</button>';
            }
            html += '<div class="chg-line chg-' + g.cls + '">' +
                '<span class="chg-path" title="' + ep + '">' + g.mark + '  ' + ep + '</span>' +
                '<span class="chg-acts">' + acts + '</span></div>';
        });
        html += '</div></div>';
    });
    if (!any) return '<div class="change-empty">本次提交无文件变更记录</div>';
    return html;
}

// 历史详情内按钮：用 data-*，避免中文路径破坏 onclick 引号
document.addEventListener('click', function(e) {
    const btn = e.target.closest && e.target.closest('#historyDetail [data-act]');
    if (!btn) return;
    e.stopPropagation();
    const act = btn.getAttribute('data-act');
    const path = btn.getAttribute('data-path');
    const rev = Number(btn.getAttribute('data-rev'));
    const kind = btn.getAttribute('data-kind');
    if (!path || !Number.isFinite(rev) || rev < 0) return;
    if (act === 'dl') downloadRevFile(path, rev, kind);
    else if (act === 'diff') diffRevFile(path, rev, kind);
});

function downloadRevFile(path, rev, changeKind) {
    // kind === 'at'：按给定 rev 精确下载；deleted 兼容旧调用时回退上一修订
    let targetRev = Number(rev);
    if (changeKind === 'deleted') {
        const prev = findPrevRev(targetRev);
        if (prev == null) {
            showToast('没有更早的修订可下载该文件', 'error');
            return;
        }
        targetRev = prev;
    }
    if (!targetRev || targetRev < 1) {
        showToast('无效修订号', 'error');
        return;
    }
    const url = '/api/rev_file?rev=' + encodeURIComponent(targetRev) +
        '&file=' + encodeURIComponent(path);
    const base = String(path).split('/').pop() || 'file';
    const saveName = 'r' + targetRev + '_' + base;
    showLoading('正在导出 r' + targetRev + ' …');
    fetch(url).then(function(r) {
        if (!r.ok) {
            return r.json().then(function(j) {
                throw new Error((j && j.error) || ('HTTP ' + r.status));
            }).catch(function(e) {
                if (e && e.message && e.message.indexOf('HTTP') === 0) throw e;
                throw new Error((e && e.message) || ('HTTP ' + r.status));
            });
        }
        return r.blob();
    }).then(function(blob) {
        hideLoading();
        const a = document.createElement('a');
        const obj = URL.createObjectURL(blob);
        a.href = obj;
        a.download = saveName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(obj); }, 2000);
        document.getElementById('statusBar').textContent = '已导出 ' + saveName;
    }).catch(function(err) {
        hideLoading();
        showToast('下载失败: ' + (err && err.message ? err.message : err), 'error');
    });
}

function findPrevRev(rev) {
    const earlier = historyCache
        .map(v => v.version)
        .filter(v => v < rev);
    return earlier.length ? Math.max.apply(null, earlier) : null;
}

function diffRevFile(path, rev, changeKind) {
    let fromRev, toRev;
    if (changeKind === 'added') {
        // 相对空 → 本修订
        fromRev = 'empty';
        toRev = rev;
        // API 不支持 empty，用一个不存在的伪修订无法工作；改为 from=prev（文件不存在）或直接 to 与空
        // 实现：from 用 prev（若无则用特殊），后端 missing 一侧即可
        const prev = findPrevRev(rev);
        fromRev = prev != null ? prev : 0; // r0 视为不存在
        toRev = rev;
    } else if (changeKind === 'deleted') {
        const prev = findPrevRev(rev);
        if (prev == null) {
            showToast('没有更早修订可对比', 'error');
            return;
        }
        fromRev = prev;
        toRev = rev; // 本修订已删除 → to missing
    } else {
        // modified
        const prev = findPrevRev(rev);
        if (prev == null) {
            showToast('没有更早修订可对比', 'error');
            return;
        }
        fromRev = prev;
        toRev = rev;
    }
    openDiffModal(path, fromRev, toRev);
}

function openDiffModal(path, fromRev, toRev) {
    document.getElementById('diffTitle').textContent = '对比 · ' + path;
    document.getElementById('diffMeta').textContent = '加载中…';
    document.getElementById('diffBody').innerHTML = '<div class="diff-empty">正在生成对比…</div>';
    document.getElementById('diffDlFrom').style.display = 'none';
    document.getElementById('diffDlTo').style.display = 'none';
    document.getElementById('diffModal').classList.add('show');

    const q = 'diff?file=' + encodeURIComponent(path) +
        '&from=' + encodeURIComponent(fromRev) +
        '&to=' + encodeURIComponent(toRev);
    api(q, 'GET', null, d => {
        if (!d.ok) {
            document.getElementById('diffMeta').textContent = d.msg || '对比失败';
            document.getElementById('diffBody').innerHTML =
                '<div class="diff-empty">' + esc(d.msg || '对比失败') + '</div>';
            return;
        }
        let meta = esc(d.from_label) + ' → ' + esc(d.to_label);
        if (d.mode === 'binary') {
            meta += ' · 二进制';
        } else if (d.identical) {
            meta += ' · 内容相同';
        } else if (d.stats) {
            meta += ' · +' + d.stats.added + ' / -' + d.stats.removed + ' 行';
        }
        if (d.from_size != null || d.to_size != null) {
            meta += ' · ' + formatBytes(d.from_size || 0) + ' → ' + formatBytes(d.to_size || 0);
        }
        document.getElementById('diffMeta').textContent = meta;

        const btnFrom = document.getElementById('diffDlFrom');
        const btnTo = document.getElementById('diffDlTo');
        if (!d.from_missing && /^\d+$/.test(String(fromRev)) && Number(fromRev) > 0) {
            btnFrom.style.display = '';
            btnFrom.textContent = '下载修改前 ' + d.from_label;
            btnFrom.onclick = function() {
                downloadRevFile(path, Number(fromRev), 'at');
            };
        }
        if (!d.to_missing && /^\d+$/.test(String(toRev)) && Number(toRev) > 0) {
            btnTo.style.display = '';
            btnTo.textContent = '下载修改后 ' + d.to_label;
            btnTo.onclick = function() {
                downloadRevFile(path, Number(toRev), 'at');
            };
        }

        if (d.mode === 'binary') {
            document.getElementById('diffBody').innerHTML =
                '<div class="diff-empty">' + esc(d.msg || '二进制文件无法文本对比') +
                '<br><br>请使用下方按钮分别下载两端版本</div>';
            return;
        }
        if (d.identical || !d.unified) {
            document.getElementById('diffBody').innerHTML =
                '<div class="diff-empty">' + esc(d.msg || '两端内容相同') + '</div>';
            return;
        }
        document.getElementById('diffBody').innerHTML = renderUnifiedDiff(d.unified);
    }, () => {
        document.getElementById('diffMeta').textContent = '请求失败';
        document.getElementById('diffBody').innerHTML = '<div class="diff-empty">请求失败</div>';
    });
}

function formatBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderUnifiedDiff(text) {
    const lines = String(text || '').split('\n');
    let html = '';
    lines.forEach(line => {
        let cls = 'ctx';
        if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@')) cls = 'dh';
        else if (line.startsWith('+')) cls = 'add';
        else if (line.startsWith('-')) cls = 'del';
        html += '<div class="diff-line ' + cls + '">' + esc(line || ' ') + '</div>';
    });
    return html || '<div class="diff-empty">无差异输出</div>';
}

function showSaveDialog() { showCommitModal(); }
function showHistory() { showHistoryModal(); }

function showCommitModal() {
    if (document.getElementById('toolbarCommitBtn').disabled) {
        showToast('没有需要提交的变更', 'error');
        return;
    }
    document.getElementById('pendingSummary').textContent = '正在检查工作副本变更…';
    document.getElementById('pendingChanges').innerHTML = '';
    document.getElementById('saveVersionBtn').disabled = true;
    document.getElementById('commitModal').classList.add('show');
    loadCommitPanel();
}

function showHistoryModal() {
    selectedHistoryVer = null;
    document.getElementById('historyModal').classList.add('show');
    loadHistoryPanel();
}

function loadCommitPanel() {
    document.getElementById('pendingSummary').textContent = '正在检查工作副本变更…';
    document.getElementById('pendingChanges').innerHTML = '';
    document.getElementById('saveVersionBtn').disabled = true;
    api('pending_changes', 'GET', null, d => {
        applyPendingToToolbar(d);
        if (!d.ok) {
            document.getElementById('pendingSummary').textContent = d.msg || '无法获取变更';
            return;
        }
        if (!d.has_changes) {
            document.getElementById('pendingSummary').textContent = '工作副本干净，没有需要提交的变更';
            document.getElementById('pendingChanges').innerHTML = '<div class="change-empty">与 HEAD 一致</div>';
            document.getElementById('saveVersionBtn').disabled = true;
            return;
        }
        const parts = [];
        if (d.added.length) parts.push('新增 ' + d.added.length);
        if (d.modified.length) parts.push('修改 ' + d.modified.length);
        if (d.deleted.length) parts.push('删除 ' + d.deleted.length);
        document.getElementById('pendingSummary').textContent =
            (d.is_first ? '首次提交 · ' : '相对 HEAD r' + (d.head_revision || 0) + ' · ') +
            parts.join('，') + '（跟踪 ' + d.total_files + ' 个文件）';
        document.getElementById('pendingChanges').innerHTML = renderChangeLines(d);
        document.getElementById('saveVersionBtn').disabled = false;
        setTimeout(() => document.getElementById('noteInput').focus(), 80);
    }, () => {
        document.getElementById('pendingSummary').textContent = '检查变更失败';
    });
}

function doSaveVersion() {
    const note = document.getElementById('noteInput').value.trim();
    if (!note) {
        showToast('请填写提交说明', 'error');
        document.getElementById('noteInput').focus();
        return;
    }
    showLoading('正在提交修订…');
    api('save_version', 'POST', {note: note}, d => {
        hideLoading();
        if (d.ok) {
            document.getElementById('noteInput').value = '';
            closeModal('commitModal');
            showToast(d.msg, 'success');
            refresh();
            showHistoryModal();
        } else showToast(d.msg, 'error');
    }, () => { hideLoading(); showToast('提交失败', 'error'); });
}

function loadHistoryPanel() {
    const list = document.getElementById('historyList');
    const detail = document.getElementById('historyDetail');
    const countEl = document.getElementById('historyCount');
    list.innerHTML = '<div class="change-empty">加载修订历史…</div>';
    detail.innerHTML = '<div class="hist-detail-empty">加载中…</div>';
    countEl.textContent = '';
    api('history', 'GET', null, data => {
        historyCache = data.history || [];
        if (!historyCache.length) {
            list.innerHTML = '<div class="change-empty">暂无修订历史</div>';
            detail.innerHTML = '<div class="hist-detail-empty">提交后将在这里显示修订详情</div>';
            countEl.textContent = '0 条修订';
            return;
        }
        countEl.textContent = '共 ' + historyCache.length + ' 条修订';
        let html = '';
        historyCache.forEach(v => {
            const note = (v.note || '').trim() || '（无说明）';
            html += '<div class="hist-row" data-ver="' + v.version + '" onclick="selectHistoryRev(' + v.version + ')">' +
                '<div class="rev">r' + v.version + '</div>' +
                '<div class="meta">' +
                    '<div class="note" title="' + esc(note) + '">' + esc(note) + '</div>' +
                    '<div class="time">' + esc(v.time || '') + '</div>' +
                    '<div class="chips">' + changeChipsHtml(v.changes) + '</div>' +
                '</div>' +
                '<div class="ops">' +
                    '<button type="button" class="btn btn-sm btn-danger" onclick="event.stopPropagation();doRollback(' + v.version + ')">回滚</button>' +
                '</div>' +
            '</div>';
        });
        list.innerHTML = html;
        const pick = selectedHistoryVer && historyCache.some(v => v.version === selectedHistoryVer)
            ? selectedHistoryVer
            : historyCache[0].version;
        selectHistoryRev(pick);
    }, () => {
        list.innerHTML = '<div class="change-empty">加载历史失败</div>';
        detail.innerHTML = '<div class="hist-detail-empty">加载失败</div>';
    });
}

function selectHistoryRev(ver) {
    selectedHistoryVer = ver;
    document.querySelectorAll('.hist-row').forEach(row => {
        row.classList.toggle('active', Number(row.dataset.ver) === Number(ver));
    });
    const v = historyCache.find(x => Number(x.version) === Number(ver));
    const detail = document.getElementById('historyDetail');
    if (!v) {
        detail.innerHTML = '<div class="hist-detail-empty">未找到该修订</div>';
        return;
    }
    const note = (v.note || '').trim();
    const changes = v.changes || {};
    const nA = (changes.added || []).length;
    const nM = (changes.modified || []).length;
    const nD = (changes.deleted || []).length;
    const total = nA + nM + nD;
    let html = '<div class="hist-detail-body">';
    html += '<div class="hist-detail-title">' +
        '<span class="rev-big">r' + v.version + '</span>' +
        '<span class="when">' + esc(v.time || '') + '</span>' +
        '</div>';
    html += '<div class="hist-detail-note' + (note ? '' : ' empty') + '">' +
        esc(note || '本次提交未填写说明') + '</div>';
    html += '<div class="hist-section-label">变更概览 <span class="chips">' +
        changeChipsHtml(changes) + '</span>' +
        '<span style="font-weight:400;color:var(--muted)">共 ' + total + ' 项</span></div>';
    html += renderGroupedChanges(changes, v.version);
    html += '<div class="hist-detail-actions">' +
        '<button type="button" class="btn btn-danger" onclick="doRollback(' + v.version + ')">回滚到此修订</button>' +
        '<span style="font-size:var(--fs-sm);color:var(--muted);align-self:center">将覆盖工作副本中未提交的修改</span>' +
        '</div>';
    html += '</div>';
    detail.innerHTML = html;
}

function doRollback(ver) {
    if (confirm('确定将工作副本恢复到修订 r' + ver + ' 吗？\n未提交修改将被覆盖。')) {
        showLoading('正在恢复到 r' + ver + '…');
        api('rollback', 'POST', {version: ver}, d => {
            hideLoading();
            if (d.ok) {
                closeModal('historyModal');
                refresh();
                showToast(d.msg, 'success');
            } else showToast(d.msg, 'error');
        }, () => { hideLoading(); showToast('恢复失败', 'error'); });
    }
}

// 中间分割条拖拽调整左右面板宽度
(function initSplitter() {
    const splitter = document.getElementById('splitter');
    const filePanel = document.getElementById('filePanel');
    const main = document.querySelector('.main');
    if (!splitter || !filePanel || !main) return;

    let dragging = false;

    splitter.addEventListener('mousedown', function(e) {
        e.preventDefault();
        dragging = true;
        splitter.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        const rect = main.getBoundingClientRect();
        let pct = ((e.clientX - rect.left) / rect.width) * 100;
        if (pct < 15) pct = 15;
        if (pct > 70) pct = 70;
        filePanel.style.width = pct + '%';
        filePanel.style.minWidth = '0';
        filePanel.style.maxWidth = 'none';
    });

    document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false;
        splitter.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
    });
})();

// 从资源管理器改完文件回到窗口时，静默更新状态（不重载预览）
window.addEventListener('focus', function() { refreshQuiet(); });
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') refreshQuiet();
});
// 定时只刷新待提交统计，避免整页闪烁
setInterval(function() {
    if (document.visibilityState === 'visible' && workspaceReady && loadingCount === 0) {
        refreshVersionToolbar();
    }
}, 15000);

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isPreviewFullscreen()) {
        // 有弹窗时优先关弹窗，不顺带退全屏
        const openModal = document.querySelector('.modal-overlay.show');
        if (openModal) return;
        setPreviewFullscreen(false);
    }
});

refresh();
